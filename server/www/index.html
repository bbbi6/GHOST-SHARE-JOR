<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ghost Share Jor - Broadcast Viewer</title>
  <style>
    /* Self-contained Obsidian Broadcast Studio tokens (works over HTTP, subpath routes, and file://) */
    :root {
      --bg-canvas: #09090b;
      --bg-surface: #111114;
      --bg-elevated: #18181d;
      --bg-hover: #202027;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --border-highlight: rgba(255, 255, 255, 0.06);

      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;

      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --accent-border: rgba(56, 189, 248, 0.36);

      --live: #22c55e;
      --live-glow: rgba(34, 197, 94, 0.45);
      --danger: #ef4444;

      --font-sans: "Geist", "Segoe UI Variable Text", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-fast: 140ms;
      --dur-med: 240ms;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      overflow-x: clip;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      background-color: var(--bg-canvas);
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background-color: var(--bg-canvas);
    }

    video.cover {
      object-fit: cover;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Top Studio Bar */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
    }

    .stage.hud-visible .top-bar,
    .stage:not(.is-live) .top-bar,
    .stage:focus-within .top-bar {
      opacity: 1;
      transform: translateY(0);
    }

    .top-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      background-color: rgba(17, 17, 20, 0.92);
      border: 1px solid var(--border-hairline);
      box-shadow: inset 0 1px 0 var(--border-highlight), 0 8px 24px rgba(0, 0, 0, 0.45);
      min-width: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--text-muted);
      flex-shrink: 0;
      transition: background-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
    }

    .stage.is-live .status-dot {
      background-color: var(--live);
      box-shadow: 0 0 10px var(--live-glow);
    }

    .brand-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      line-height: 1;
      white-space: nowrap;
    }

    .divider-v {
      width: 1px;
      height: 14px;
      background-color: var(--border-hairline);
      flex-shrink: 0;
    }

    .room-tag {
      font-size: 11.5px;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .telemetry-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      height: 36px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      background-color: rgba(17, 17, 20, 0.92);
      border: 1px solid var(--border-hairline);
      box-shadow: inset 0 1px 0 var(--border-highlight), 0 8px 24px rgba(0, 0, 0, 0.45);
      font-size: 11.5px;
      line-height: 1;
      flex-shrink: 0;
    }

    .telemetry-pill.hidden,
    .stage:not(.is-live) .telemetry-pill {
      display: none;
    }

    .stat-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .stat-k {
      color: var(--text-muted);
      font-size: 10.5px;
      letter-spacing: 0.06em;
    }

    .stat-v {
      color: var(--text-primary);
      font-weight: 500;
    }

    .stat-v.accent {
      color: var(--accent);
    }

    /* Unmute CTA (only visible when stream is live and muted) */
    .unmute-pill {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--accent-border);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      box-shadow: inset 0 1px 0 var(--border-highlight), 0 12px 32px rgba(0, 0, 0, 0.55);
      transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }

    .unmute-pill:hover {
      background-color: var(--bg-elevated);
      border-color: var(--accent);
    }

    .unmute-pill:active {
      transform: translateX(-50%) scale(0.98);
    }

    .unmute-pill:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .stage:not(.is-live) .unmute-pill,
    .unmute-pill.hidden {
      display: none;
    }

    /* Standby Panel */
    .standby-overlay {
      position: absolute;
      inset: 0;
      z-index: 18;
      width: 100%;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(ellipse 60% 45% at 50% 42%, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
      transition: opacity var(--dur-med) var(--ease-out), visibility var(--dur-med) var(--ease-out);
    }

    .standby-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .standby-card {
      width: 100%;
      max-width: min(440px, 100%);
      min-width: 0;
      border-radius: var(--radius-lg);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      box-shadow: inset 0 1px 0 var(--border-highlight), 0 24px 64px rgba(0, 0, 0, 0.65);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .standby-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .receiver-badge {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      display: grid;
      place-items: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .state-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 26px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      background-color: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent);
      animation: softPulse 1.8s ease-in-out infinite;
    }

    @keyframes softPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .standby-copy {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .standby-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: var(--text-primary);
    }

    .standby-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.55;
      max-width: 42ch;
    }

    .standby-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--border-hairline);
    }

    .meta-cell {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .meta-k {
      font-size: 10px;
      letter-spacing: 0.07em;
      color: var(--text-muted);
    }

    .meta-v {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom Playback Dock (hidden until live) */
    .bottom-dock {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 20px;
      z-index: 20;
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-lg);
      background-color: rgba(17, 17, 20, 0.94);
      border: 1px solid var(--border-hairline);
      box-shadow: inset 0 1px 0 var(--border-highlight), 0 16px 40px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
      pointer-events: none;
    }

    .stage.is-live.hud-visible .bottom-dock,
    .stage.is-live:focus-within .bottom-dock {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .meter-strip {
      display: grid;
      grid-template-columns: repeat(48, 1fr);
      align-items: end;
      gap: 3px;
      height: 14px;
    }

    .meter-tick {
      width: 100%;
      min-height: 2px;
      height: 2px;
      border-radius: 1px;
      background-color: rgba(255, 255, 255, 0.12);
      transition: height var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
    }

    .meter-tick.active {
      background-color: var(--accent);
    }

    .dock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dock-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }

    .ctrl-btn:hover {
      background-color: var(--bg-hover);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .ctrl-btn:active {
      transform: scale(0.98);
    }

    .ctrl-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .ctrl-btn.active {
      border-color: var(--accent-border);
      background-color: var(--accent-soft);
      color: var(--accent);
    }

    .volume-wrap {
      display: inline-flex;
      align-items: center;
      padding: 0 4px;
    }

    input[type="range"].volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 76px;
      height: 4px;
      border-radius: 2px;
      background-color: rgba(255, 255, 255, 0.14);
      outline: none;
      cursor: pointer;
    }

    input[type="range"].volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--text-primary);
      border: 2px solid var(--bg-surface);
      cursor: pointer;
    }

    input[type="range"].volume-slider:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .watch-timer {
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 0 6px;
      line-height: 1;
    }

    .stage.is-live.hud-idle {
      cursor: none;
    }

    @media (max-width: 640px) {
      .telemetry-pill .stat-item:nth-child(n+3),
      .volume-wrap,
      .watch-timer {
        display: none;
      }

      .meter-strip {
        grid-template-columns: repeat(24, 1fr);
      }

      .meter-tick:nth-child(n+25) {
        display: none;
      }

      .btn-label {
        display: none;
      }

      .ctrl-btn {
        width: 34px;
        padding: 0;
      }

      .standby-card {
        padding: 22px;
      }

      .standby-meta-grid {
        grid-template-columns: 1fr 1fr;
      }

      .standby-meta-grid .meta-cell:last-child {
        grid-column: span 2;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage hud-visible" id="stage">
    <video id="videoPlayer" autoplay playsinline muted></video>

    <header class="top-bar">
      <div class="top-pill">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="brand-name">Ghost Share Jor</span>
        <span class="divider-v" aria-hidden="true"></span>
        <span class="room-tag mono" id="roomLabel">room / default</span>
      </div>

      <div class="telemetry-pill mono" id="telemetryPill">
        <span class="stat-item"><span class="stat-k">RES</span><span class="stat-v" id="statRes">--</span></span>
        <span class="stat-item"><span class="stat-k">FPS</span><span class="stat-v" id="statFps">--</span></span>
        <span class="stat-item"><span class="stat-k">RATE</span><span class="stat-v accent" id="statRate">--</span></span>
        <span class="stat-item"><span class="stat-k">RTT</span><span class="stat-v" id="statRtt">--</span></span>
      </div>
    </header>

    <button class="unmute-pill" id="unmuteBtn" type="button" aria-label="Unmute broadcast audio">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
      <span>Click to unmute stream</span>
    </button>

    <section class="standby-overlay" id="overlay" aria-live="polite">
      <div class="standby-card">
        <div class="standby-head">
          <div class="receiver-badge" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="14" rx="2"/>
              <path d="M8 21h8"/>
              <path d="M12 18v3"/>
            </svg>
          </div>
          <div class="state-chip mono" id="statusKicker">
            <span class="pulse-dot" aria-hidden="true"></span>
            <span id="statusKickerText">STANDBY</span>
          </div>
        </div>

        <div class="standby-copy">
          <h1 class="standby-title" id="statusTitle">Waiting for host</h1>
          <p class="standby-desc" id="statusDesc">Screen share is not live yet. Automatically checking for incoming broadcast every 3 seconds.</p>
        </div>

        <div class="standby-meta-grid">
          <div class="meta-cell">
            <span class="meta-k mono">ROOM</span>
            <span class="meta-v mono" id="standbyMeta">default</span>
          </div>
          <div class="meta-cell">
            <span class="meta-k mono">PROTOCOL</span>
            <span class="meta-v mono">WebRTC WHEP</span>
          </div>
          <div class="meta-cell">
            <span class="meta-k mono">AUDIO</span>
            <span class="meta-v mono">Opus 48kHz</span>
          </div>
        </div>
      </div>
    </section>

    <footer class="bottom-dock">
      <div class="meter-strip" id="meterStrip" aria-hidden="true"></div>

      <div class="dock-row">
        <div class="dock-group">
          <button class="ctrl-btn" id="audioToggle" type="button" title="Mute or unmute (M)" aria-label="Toggle mute">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            <span class="btn-label">Unmute</span>
          </button>

          <div class="volume-wrap">
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.02" value="1" aria-label="Volume">
          </div>

          <span class="watch-timer mono" id="watchTimer">00:00</span>
        </div>

        <div class="dock-group">
          <button class="ctrl-btn" id="fitBtn" type="button" title="Toggle Fit or Fill" aria-label="Toggle video fit">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 9H6v2m10-2h2v2m-10 4H6v-2m10 2h2v-2"/></svg>
            <span class="btn-label" id="fitLabel">Fit</span>
          </button>

          <button class="ctrl-btn" id="statsBtn" type="button" title="Toggle telemetry" aria-label="Toggle telemetry">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
            <span class="btn-label">Stats</span>
          </button>

          <button class="ctrl-btn" id="pipBtn" type="button" title="Picture in Picture (P)" aria-label="Picture in Picture">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1"/></svg>
            <span class="btn-label">PiP</span>
          </button>

          <button class="ctrl-btn" id="fullscreenBtn" type="button" title="Fullscreen (F)" aria-label="Toggle fullscreen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            <span class="btn-label">Full</span>
          </button>
        </div>
      </div>
    </footer>
  </main>

  <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    let roomId = pathParts[pathParts.length - 1] || '';
    if (!roomId || roomId === 'r' || roomId.toLowerCase().endsWith('.html')) {
      const urlParams = new URLSearchParams(window.location.search);
      roomId = urlParams.get('room') || 'default';
    }
    document.getElementById('roomLabel').textContent = `room / ${roomId}`;
    document.getElementById('standbyMeta').textContent = roomId;

    const stage = document.getElementById('stage');
    const video = document.getElementById('videoPlayer');
    const overlay = document.getElementById('overlay');
    const statusKickerText = document.getElementById('statusKickerText');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const unmuteBtn = document.getElementById('unmuteBtn');
    const audioToggle = document.getElementById('audioToggle');
    const volumeSlider = document.getElementById('volumeSlider');
    const fitBtn = document.getElementById('fitBtn');
    const fitLabel = document.getElementById('fitLabel');
    const statsBtn = document.getElementById('statsBtn');
    const telemetryPill = document.getElementById('telemetryPill');
    const pipBtn = document.getElementById('pipBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const watchTimer = document.getElementById('watchTimer');
    const meterStrip = document.getElementById('meterStrip');

    const statRes = document.getElementById('statRes');
    const statFps = document.getElementById('statFps');
    const statRate = document.getElementById('statRate');
    const statRtt = document.getElementById('statRtt');

    const whepEndpoint = `${window.location.origin}/${roomId}/whep`;

    const TICK_COUNT = 48;
    const meterHistory = new Array(TICK_COUNT).fill(0);
    const tickEls = [];
    for (let i = 0; i < TICK_COUNT; i++) {
      const el = document.createElement('div');
      el.className = 'meter-tick';
      meterStrip.appendChild(el);
      tickEls.push(el);
    }

    function renderMeter(mbps) {
      meterHistory.shift();
      meterHistory.push(Math.max(0, mbps));
      const peak = Math.max(4, ...meterHistory);
      for (let i = 0; i < TICK_COUNT; i++) {
        const val = meterHistory[i];
        const px = val > 0 ? Math.max(3, Math.round((val / peak) * 14)) : 2;
        tickEls[i].style.height = `${px}px`;
        tickEls[i].classList.toggle('active', val > 0.05);
      }
    }

    function resetMeter() {
      meterHistory.fill(0);
      for (let i = 0; i < TICK_COUNT; i++) {
        tickEls[i].style.height = '2px';
        tickEls[i].classList.remove('active');
      }
    }

    let pc = null;
    let retryTimeout = null;
    let statsInterval = null;
    let timerInterval = null;
    let connectedAt = 0;
    let prevBytesReceived = 0;
    let prevStatsTime = 0;
    let idleTimeout = null;
    let statsVisible = true;

    statsBtn.classList.add('active');
    if (!document.pictureInPictureEnabled) {
      pipBtn.style.display = 'none';
    }

    function wakeHud() {
      stage.classList.add('hud-visible');
      stage.classList.remove('hud-idle');
      clearTimeout(idleTimeout);
      if (overlay.classList.contains('hidden')) {
        idleTimeout = setTimeout(() => {
          stage.classList.remove('hud-visible');
          stage.classList.add('hud-idle');
        }, 2800);
      }
    }

    stage.addEventListener('mousemove', wakeHud);
    stage.addEventListener('touchstart', wakeHud, { passive: true });
    stage.addEventListener('click', wakeHud);

    function formatElapsed(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function startWatchTimer() {
      connectedAt = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        watchTimer.textContent = formatElapsed(Date.now() - connectedAt);
      }, 1000);
    }

    function stopWatchTimer() {
      clearInterval(timerInterval);
      watchTimer.textContent = '00:00';
    }

    function startStatsPolling() {
      clearInterval(statsInterval);
      prevBytesReceived = 0;
      prevStatsTime = 0;
      statsInterval = setInterval(async () => {
        if (!pc || pc.connectionState !== 'connected') return;
        try {
          const stats = await pc.getStats();
          let rttMs = null;
          stats.forEach((report) => {
            if (report.type === 'inbound-rtp' && report.kind === 'video') {
              if (report.frameWidth && report.frameHeight) {
                statRes.textContent = `${report.frameWidth}x${report.frameHeight}`;
              }
              if (typeof report.framesPerSecond === 'number') {
                statFps.textContent = `${Math.round(report.framesPerSecond)}`;
              }
              const now = report.timestamp;
              if (prevStatsTime > 0 && now > prevStatsTime && report.bytesReceived >= prevBytesReceived) {
                const mbps = ((report.bytesReceived - prevBytesReceived) * 8) / ((now - prevStatsTime) * 1000);
                statRate.textContent = `${mbps.toFixed(1)} Mbps`;
                renderMeter(mbps);
              }
              prevBytesReceived = report.bytesReceived;
              prevStatsTime = now;
            }
            if (report.type === 'candidate-pair' && report.state === 'succeeded' && typeof report.currentRoundTripTime === 'number') {
              rttMs = Math.round(report.currentRoundTripTime * 1000);
            }
          });
          if (rttMs !== null) {
            statRtt.textContent = `${rttMs} ms`;
          }
        } catch (_) {}
      }, 1200);
    }

    function stopStatsPolling() {
      clearInterval(statsInterval);
      statRes.textContent = '--';
      statFps.textContent = '--';
      statRate.textContent = '--';
      statRtt.textContent = '--';
      resetMeter();
    }

    async function startWHEP() {
      if (pc) {
        pc.close();
        pc = null;
      }
      stopStatsPolling();
      stopWatchTimer();
      stage.classList.remove('is-live');

      statusKickerText.textContent = 'CONNECTING';
      statusTitle.textContent = 'Connecting to room';
      statusDesc.textContent = `Establishing low-latency stream for room "${roomId}".`;
      overlay.classList.remove('hidden');
      wakeHud();

      pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });

      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });

      pc.ontrack = (event) => {
        if (!video.srcObject) {
          if (event.streams && event.streams[0]) {
            video.srcObject = event.streams[0];
          } else {
            video.srcObject = new MediaStream([event.track]);
          }
        } else {
          if (video.srcObject instanceof MediaStream && !video.srcObject.getTracks().includes(event.track)) {
            video.srcObject.addTrack(event.track);
          }
        }
        video.play().catch(() => {});
      };

      video.onloadedmetadata = () => {
        video.play().catch(() => {});
      };
      video.oncanplay = () => {
        video.play().catch(() => {});
      };

      pc.onconnectionstatechange = () => {
        if (!pc) return;
        if (pc.connectionState === 'connected') {
          stage.classList.add('is-live');
          overlay.classList.add('hidden');
          video.play().catch(() => {});
          startWatchTimer();
          startStatsPolling();
          wakeHud();
        } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
          stage.classList.remove('is-live');
          statusKickerText.textContent = 'RECONNECTING';
          statusTitle.textContent = 'Host disconnected';
          statusDesc.textContent = 'Waiting for host to resume sharing. Retrying in 3 seconds.';
          overlay.classList.remove('hidden');
          stopStatsPolling();
          stopWatchTimer();
          scheduleRetry();
        }
      };

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await new Promise((resolve) => {
          if (pc.iceGatheringState === 'complete') {
            resolve();
          } else {
            const checkState = () => {
              if (pc.iceGatheringState === 'complete') {
                pc.removeEventListener('icegatheringstatechange', checkState);
                resolve();
              }
            };
            pc.addEventListener('icegatheringstatechange', checkState);
            setTimeout(resolve, 1500);
          }
        });

        const res = await fetch(whepEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/sdp' },
          body: pc.localDescription.sdp
        });

        if (!res.ok) {
          throw new Error(`WHEP Server responded with status ${res.status}`);
        }

        const answerSdp = await res.text();
        await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
        video.play().catch(() => {});
      } catch (err) {
        stage.classList.remove('is-live');
        statusKickerText.textContent = 'STANDBY';
        statusTitle.textContent = 'Waiting for host';
        statusDesc.textContent = 'Screen share is not live yet. Retrying automatically every 3 seconds.';
        overlay.classList.remove('hidden');
        scheduleRetry();
      }
    }

    function scheduleRetry() {
      clearTimeout(retryTimeout);
      retryTimeout = setTimeout(startWHEP, 3000);
    }

    const iconSoundOn = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
    const iconSoundOff = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;

    function syncAudioUi() {
      if (video.muted || video.volume === 0) {
        audioToggle.innerHTML = `${iconSoundOff}<span class="btn-label">Unmute</span>`;
      } else {
        unmuteBtn.classList.add('hidden');
        audioToggle.innerHTML = `${iconSoundOn}<span class="btn-label">Mute</span>`;
      }
    }

    function unmuteStream() {
      video.muted = false;
      if (video.volume === 0) {
        video.volume = 1;
        volumeSlider.value = '1';
      }
      video.play().then(syncAudioUi).catch(console.error);
    }

    function toggleMute() {
      video.muted = !video.muted;
      if (!video.muted && video.volume === 0) {
        video.volume = 1;
        volumeSlider.value = '1';
      }
      syncAudioUi();
    }

    unmuteBtn.addEventListener('click', unmuteStream);
    audioToggle.addEventListener('click', toggleMute);

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      video.volume = val;
      video.muted = (val === 0);
      syncAudioUi();
    });

    fitBtn.addEventListener('click', () => {
      const isCover = video.classList.toggle('cover');
      fitLabel.textContent = isCover ? 'Fill' : 'Fit';
      fitBtn.classList.toggle('active', isCover);
    });

    statsBtn.addEventListener('click', () => {
      statsVisible = !statsVisible;
      telemetryPill.classList.toggle('hidden', !statsVisible);
      statsBtn.classList.toggle('active', statsVisible);
    });

    pipBtn.addEventListener('click', async () => {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        console.error(err);
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        stage.requestFullscreen().catch(console.error);
      } else {
        document.exitFullscreen().catch(console.error);
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      const key = e.key.toLowerCase();
      if (key === 'm') toggleMute();
      else if (key === 'f') toggleFullscreen();
      else if (key === 'p' && document.pictureInPictureEnabled) pipBtn.click();
    });

    syncAudioUi();
    startWHEP();
  </script>
</body>
</html>
