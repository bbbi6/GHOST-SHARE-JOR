<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GHOST SHARE JOR - STUDIO VIEWER</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23050507'/><circle cx='50' cy='48' r='28' fill='%2384cc16'/><circle cx='40' cy='46' r='4.5' fill='%23050507'/><circle cx='60' cy='46' r='4.5' fill='%23050507'/></svg>">
  <style>
    :root {
      --bg-void: #030305;
      --bg-panel: rgba(12, 14, 12, 0.78);
      --bg-chip: rgba(255, 255, 255, 0.06);
      --bg-chip-hover: rgba(255, 255, 255, 0.13);
      --border-hairline: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #fbfbfb;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #84cc16;
      --accent-light: #bef264;
      --accent-soft: rgba(132, 204, 22, 0.18);
      --live: #84cc16;
      --live-red: #ef4444;
      --font-sans: "Geist", "Segoe UI Variable Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow: hidden;
      overflow-x: clip;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(132, 204, 22, 0.08) 0%, transparent 55%),
        var(--bg-void);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #030305;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    video.cover {
      object-fit: cover;
    }

    /* Subtle edge vignette for HUD legibility */
    .hud-scrim-top,
    .hud-scrim-bottom {
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 12;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .hud-scrim-top {
      top: 0;
      height: 110px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.72) 0%, transparent 100%);
    }

    .hud-scrim-bottom {
      bottom: 0;
      height: 130px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.82) 0%, transparent 100%);
    }

    .stage.hud-visible .hud-scrim-top,
    .stage.hud-visible .hud-scrim-bottom,
    .stage.hud-visible .top-hud,
    .stage.hud-visible .bottom-dock {
      opacity: 1;
      transform: translateY(0);
    }

    .stage.hud-idle {
      cursor: none;
    }

    /* Top Studio Bar */
    .top-hud {
      position: absolute;
      top: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 20;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .top-hud > * {
      pointer-events: auto;
    }

    .brand-pill,
    .telemetry-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-hairline);
      border-radius: 9999px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
    }

    .brand-name {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .divider-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .room-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .telemetry-pill {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      gap: 12px;
    }

    .telemetry-pill.hidden {
      display: none;
    }

    .stat-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .stat-label {
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
    }

    .stat-val {
      color: var(--text-primary);
      font-weight: 600;
    }

    .stat-val.good {
      color: var(--accent-light);
    }

    /* Tap to Unmute Floating Pill */
    .unmute-pill {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 20px;
      border-radius: 9999px;
      border: 1px solid rgba(132, 204, 22, 0.5);
      background: rgba(12, 16, 12, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(132, 204, 22, 0.22);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .unmute-pill:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #050703;
      transform: translateX(-50%) translateY(-1px);
    }

    .stage:not(.is-live) .unmute-pill,
    .unmute-pill.hidden {
      display: none;
    }

    /* Standby / Connecting Overlay */
    .standby-overlay {
      position: absolute;
      inset: 0;
      z-index: 18;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 45%, rgba(132, 204, 22, 0.09) 0%, rgba(3, 3, 5, 0.94) 60%),
        rgba(3, 3, 5, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s;
    }

    .standby-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .signal-radar {
      position: relative;
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      margin-bottom: 28px;
    }

    .radar-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .radar-ring.pulse {
      border-color: rgba(132, 204, 22, 0.55);
      animation: radarPulse 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .radar-ring.spin {
      inset: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      border-top-color: var(--accent);
      animation: spin 1.1s linear infinite;
    }

    .radar-core {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(132, 204, 22, 0.08);
      border: 1px solid rgba(132, 204, 22, 0.25);
      display: grid;
      place-items: center;
    }

    @keyframes radarPulse {
      0% { transform: scale(0.88); opacity: 0.9; }
      100% { transform: scale(1.38); opacity: 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .standby-kicker {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .standby-title {
      font-size: clamp(1.35rem, 2.5vw, 1.75rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 8px;
      text-align: center;
    }

    .standby-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      text-align: center;
      max-width: 380px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .standby-meta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      border-radius: 9999px;
      border: 1px solid var(--border-hairline);
      background: rgba(255, 255, 255, 0.03);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Bottom Floating Cinema Dock */
    .bottom-dock {
      position: absolute;
      bottom: 22px;
      left: 24px;
      right: 24px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: var(--bg-panel);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border-hairline);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dock-left,
    .dock-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(132, 204, 22, 0.14);
      border: 1px solid rgba(132, 204, 22, 0.35);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent-light);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: liveBlink 1.6s ease-in-out infinite;
    }

    .stage:not(.is-live) .live-pill {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-hairline);
      color: var(--text-muted);
    }

    .stage:not(.is-live) .live-dot {
      background: var(--text-muted);
      animation: none;
    }

    @keyframes liveBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .watch-timer {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      padding-left: 4px;
    }

    .volume-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 72px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      accent-color: var(--accent);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-light);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: var(--bg-chip);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.15s ease;
    }

    .ctrl-btn:hover {
      background: var(--bg-chip-hover);
      border-color: var(--border-hairline);
    }

    .ctrl-btn:active {
      transform: scale(0.97);
    }

    .ctrl-btn.active {
      background: var(--accent-soft);
      border-color: rgba(132, 204, 22, 0.45);
      color: var(--accent-light);
    }

    .ctrl-btn:focus-visible,
    .unmute-pill:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (max-width: 680px) {
      .top-hud {
        top: 12px;
        left: 12px;
        right: 12px;
        flex-wrap: wrap;
      }
      .telemetry-pill {
        display: none;
      }
      .bottom-dock {
        bottom: 12px;
        left: 12px;
        right: 12px;
        padding: 8px 10px;
      }
      .volume-slider,
      .btn-label {
        display: none;
      }
      .volume-group {
        padding: 0;
        border: none;
        background: transparent;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <main class="stage hud-visible" id="stage">
    <video id="videoPlayer" playsinline autoplay muted></video>

    <div class="hud-scrim-top"></div>
    <div class="hud-scrim-bottom"></div>

    <!-- Top Studio Header -->
    <header class="top-hud">
      <div class="brand-pill">
        <div class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C7.58 2 4 5.58 4 10v10l2.67-2 2.66 2L12 18l2.67 2 2.66-2L20 20V10c0-4.42-3.58-8-8-8z" fill="#84cc16"/>
            <circle cx="9.5" cy="10" r="1.4" fill="#030305"/>
            <circle cx="14.5" cy="10" r="1.4" fill="#030305"/>
          </svg>
        </div>
        <span class="brand-name">GHOST SHARE JOR</span>
        <span class="divider-dot"></span>
        <span class="room-tag" id="roomLabel">room / default</span>
      </div>

      <div class="telemetry-pill" id="telemetryPill">
        <span class="stat-item"><span class="stat-label">RES</span> <span class="stat-val" id="statRes">--</span></span>
        <span class="divider-dot"></span>
        <span class="stat-item"><span class="stat-label">FPS</span> <span class="stat-val" id="statFps">--</span></span>
        <span class="divider-dot"></span>
        <span class="stat-item"><span class="stat-label">RATE</span> <span class="stat-val" id="statRate">--</span></span>
        <span class="divider-dot"></span>
        <span class="stat-item"><span class="stat-label">RTT</span> <span class="stat-val good" id="statRtt">--</span></span>
      </div>
    </header>

    <!-- Tap to Unmute Banner -->
    <button class="unmute-pill" id="unmuteBtn" type="button" aria-label="Unmute stream audio">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      Tap to Unmute Stream Audio
    </button>

    <!-- Standby / Connecting Overlay -->
    <section class="standby-overlay" id="overlay" aria-live="polite">
      <div class="signal-radar" aria-hidden="true">
        <div class="radar-ring pulse"></div>
        <div class="radar-ring spin"></div>
        <div class="radar-core">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C7.58 2 4 5.58 4 10v10l2.67-2 2.66 2L12 18l2.67 2 2.66-2L20 20V10c0-4.42-3.58-8-8-8z" fill="#84cc16"/>
            <circle cx="9.5" cy="10" r="1.4" fill="#050507"/>
            <circle cx="14.5" cy="10" r="1.4" fill="#050507"/>
          </svg>
        </div>
      </div>
      <div class="standby-kicker" id="statusKicker">WEBRTC WHEP STREAM</div>
      <h1 class="standby-title" id="statusTitle">Connecting to Room</h1>
      <p class="standby-desc" id="statusDesc">Establishing low-latency peer handshake with media server...</p>
      <div class="standby-meta" id="standbyMeta">Room ID: default</div>
    </section>

    <!-- Bottom Cinema Control Dock -->
    <footer class="bottom-dock">
      <div class="dock-left">
        <div class="live-pill">
          <span class="live-dot"></span>
          <span id="liveText">STANDBY</span>
        </div>
        <span class="watch-timer" id="watchTimer">00:00</span>
      </div>

      <div class="dock-right">
        <div class="volume-group">
          <button class="ctrl-btn" id="audioToggle" type="button" aria-label="Toggle mute (M)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            <span class="btn-label">Unmute</span>
          </button>
          <input class="volume-slider" id="volumeSlider" type="range" min="0" max="1" step="0.02" value="1" aria-label="Stream volume">
        </div>

        <button class="ctrl-btn" id="fitBtn" type="button" title="Toggle Fit / Fill" aria-label="Toggle video fit mode">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15l3-3 2 2 5-5"/></svg>
          <span class="btn-label" id="fitLabel">Fit</span>
        </button>

        <button class="ctrl-btn" id="statsBtn" type="button" title="Toggle Telemetry" aria-label="Toggle stream stats">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 3 5-6"/></svg>
          <span class="btn-label">Stats</span>
        </button>

        <button class="ctrl-btn" id="pipBtn" type="button" title="Picture in Picture (P)" aria-label="Picture in Picture">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1"/></svg>
          <span class="btn-label">PiP</span>
        </button>

        <button class="ctrl-btn" id="fullscreenBtn" type="button" title="Fullscreen (F)" aria-label="Toggle fullscreen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          <span class="btn-label">Full</span>
        </button>
      </div>
    </footer>
  </main>

  <script>
    // Extract room id from URL: /r/{room_id} or ?room={room_id}
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    let roomId = pathParts[pathParts.length - 1] || '';
    if (!roomId || roomId === 'r' || roomId.toLowerCase().endsWith('.html')) {
      const urlParams = new URLSearchParams(window.location.search);
      roomId = urlParams.get('room') || 'default';
    }
    document.getElementById('roomLabel').textContent = `room / ${roomId}`;
    document.getElementById('standbyMeta').textContent = `Room ID: ${roomId}`;

    const stage = document.getElementById('stage');
    const video = document.getElementById('videoPlayer');
    const overlay = document.getElementById('overlay');
    const statusKicker = document.getElementById('statusKicker');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const unmuteBtn = document.getElementById('unmuteBtn');
    const audioToggle = document.getElementById('audioToggle');
    const volumeSlider = document.getElementById('volumeSlider');
    const fitBtn = document.getElementById('fitBtn');
    const fitLabel = document.getElementById('fitLabel');
    const statsBtn = document.getElementById('statsBtn');
    const telemetryPill = document.getElementById('telemetryPill');
    const pipBtn = document.getElementById('pipBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const watchTimer = document.getElementById('watchTimer');
    const liveText = document.getElementById('liveText');

    const statRes = document.getElementById('statRes');
    const statFps = document.getElementById('statFps');
    const statRate = document.getElementById('statRate');
    const statRtt = document.getElementById('statRtt');

    const whepEndpoint = `${window.location.origin}/${roomId}/whep`;

    let pc = null;
    let retryTimeout = null;
    let statsInterval = null;
    let timerInterval = null;
    let connectedAt = 0;
    let prevBytesReceived = 0;
    let prevStatsTime = 0;
    let idleTimeout = null;
    let statsVisible = true;

    statsBtn.classList.add('active');
    if (!document.pictureInPictureEnabled) {
      pipBtn.style.display = 'none';
    }

    function wakeHud() {
      stage.classList.add('hud-visible');
      stage.classList.remove('hud-idle');
      clearTimeout(idleTimeout);
      if (overlay.classList.contains('hidden')) {
        idleTimeout = setTimeout(() => {
          stage.classList.remove('hud-visible');
          stage.classList.add('hud-idle');
        }, 2800);
      }
    }

    stage.addEventListener('mousemove', wakeHud);
    stage.addEventListener('touchstart', wakeHud, { passive: true });
    stage.addEventListener('click', wakeHud);

    function formatElapsed(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function startWatchTimer() {
      connectedAt = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        watchTimer.textContent = formatElapsed(Date.now() - connectedAt);
      }, 1000);
    }

    function stopWatchTimer() {
      clearInterval(timerInterval);
      watchTimer.textContent = '00:00';
    }

    function startStatsPolling() {
      clearInterval(statsInterval);
      prevBytesReceived = 0;
      prevStatsTime = 0;
      statsInterval = setInterval(async () => {
        if (!pc || pc.connectionState !== 'connected') return;
        try {
          const stats = await pc.getStats();
          let rttMs = null;
          stats.forEach((report) => {
            if (report.type === 'inbound-rtp' && report.kind === 'video') {
              if (report.frameWidth && report.frameHeight) {
                statRes.textContent = `${report.frameWidth}x${report.frameHeight}`;
              }
              if (typeof report.framesPerSecond === 'number') {
                statFps.textContent = `${Math.round(report.framesPerSecond)} fps`;
              }
              const now = report.timestamp;
              if (prevStatsTime > 0 && now > prevStatsTime && report.bytesReceived >= prevBytesReceived) {
                const mbps = ((report.bytesReceived - prevBytesReceived) * 8) / ((now - prevStatsTime) * 1000);
                statRate.textContent = `${mbps.toFixed(1)} Mbps`;
              }
              prevBytesReceived = report.bytesReceived;
              prevStatsTime = now;
            }
            if (report.type === 'candidate-pair' && report.state === 'succeeded' && typeof report.currentRoundTripTime === 'number') {
              rttMs = Math.round(report.currentRoundTripTime * 1000);
            }
          });
          if (rttMs !== null) {
            statRtt.textContent = `${rttMs} ms`;
          }
        } catch (_) {}
      }, 1500);
    }

    function stopStatsPolling() {
      clearInterval(statsInterval);
      statRes.textContent = '--';
      statFps.textContent = '--';
      statRate.textContent = '--';
      statRtt.textContent = '--';
    }

    async function startWHEP() {
      if (pc) {
        pc.close();
        pc = null;
      }
      stopStatsPolling();
      stopWatchTimer();
      stage.classList.remove('is-live');
      liveText.textContent = 'STANDBY';

      statusKicker.textContent = 'WEBRTC WHEP STREAM';
      statusTitle.textContent = 'Connecting to Room';
      statusDesc.textContent = `Establishing low-latency handshake for "${roomId}"...`;
      overlay.classList.remove('hidden');
      wakeHud();

      pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });

      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });

      pc.ontrack = (event) => {
        if (!video.srcObject) {
          if (event.streams && event.streams[0]) {
            video.srcObject = event.streams[0];
          } else {
            video.srcObject = new MediaStream([event.track]);
          }
        } else {
          if (video.srcObject instanceof MediaStream && !video.srcObject.getTracks().includes(event.track)) {
            video.srcObject.addTrack(event.track);
          }
        }
        video.play().catch(() => {});
      };

      video.onloadedmetadata = () => {
        video.play().catch(() => {});
      };
      video.oncanplay = () => {
        video.play().catch(() => {});
      };

      pc.onconnectionstatechange = () => {
        if (!pc) return;
        if (pc.connectionState === 'connected') {
          stage.classList.add('is-live');
          liveText.textContent = 'LIVE';
          overlay.classList.add('hidden');
          video.play().catch(() => {});
          startWatchTimer();
          startStatsPolling();
          wakeHud();
        } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
          stage.classList.remove('is-live');
          liveText.textContent = 'STANDBY';
          statusKicker.textContent = 'SIGNAL INTERRUPTED';
          statusTitle.textContent = 'Host Disconnected';
          statusDesc.textContent = 'Waiting for host to resume sharing. Reconnecting in 3s...';
          overlay.classList.remove('hidden');
          stopStatsPolling();
          stopWatchTimer();
          scheduleRetry();
        }
      };

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await new Promise((resolve) => {
          if (pc.iceGatheringState === 'complete') {
            resolve();
          } else {
            const checkState = () => {
              if (pc.iceGatheringState === 'complete') {
                pc.removeEventListener('icegatheringstatechange', checkState);
                resolve();
              }
            };
            pc.addEventListener('icegatheringstatechange', checkState);
            setTimeout(resolve, 1500);
          }
        });

        const res = await fetch(whepEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/sdp' },
          body: pc.localDescription.sdp
        });

        if (!res.ok) {
          throw new Error(`WHEP Server responded with status ${res.status}`);
        }

        const answerSdp = await res.text();
        await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
        video.play().catch(() => {});
      } catch (err) {
        stage.classList.remove('is-live');
        liveText.textContent = 'STANDBY';
        statusKicker.textContent = 'STANDBY MODE';
        statusTitle.textContent = 'Waiting for Host';
        statusDesc.textContent = 'Screen share is not live yet. Automatically retrying in 3s...';
        overlay.classList.remove('hidden');
        scheduleRetry();
      }
    }

    function scheduleRetry() {
      clearTimeout(retryTimeout);
      retryTimeout = setTimeout(startWHEP, 3000);
    }

    const iconSoundOn = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
    const iconSoundOff = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;

    function syncAudioUi() {
      if (video.muted || video.volume === 0) {
        audioToggle.innerHTML = `${iconSoundOff}<span class="btn-label">Unmute</span>`;
      } else {
        unmuteBtn.classList.add('hidden');
        audioToggle.innerHTML = `${iconSoundOn}<span class="btn-label">Mute</span>`;
      }
    }

    function unmuteStream() {
      video.muted = false;
      if (video.volume === 0) {
        video.volume = 1;
        volumeSlider.value = '1';
      }
      video.play().then(syncAudioUi).catch(console.error);
    }

    function toggleMute() {
      video.muted = !video.muted;
      if (!video.muted && video.volume === 0) {
        video.volume = 1;
        volumeSlider.value = '1';
      }
      syncAudioUi();
    }

    unmuteBtn.addEventListener('click', unmuteStream);
    audioToggle.addEventListener('click', toggleMute);

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      video.volume = val;
      video.muted = (val === 0);
      syncAudioUi();
    });

    fitBtn.addEventListener('click', () => {
      const isCover = video.classList.toggle('cover');
      fitLabel.textContent = isCover ? 'Fill' : 'Fit';
      fitBtn.classList.toggle('active', isCover);
    });

    statsBtn.addEventListener('click', () => {
      statsVisible = !statsVisible;
      telemetryPill.classList.toggle('hidden', !statsVisible);
      statsBtn.classList.toggle('active', statsVisible);
    });

    pipBtn.addEventListener('click', async () => {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        console.error(err);
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        stage.requestFullscreen().catch(console.error);
      } else {
        document.exitFullscreen().catch(console.error);
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      const key = e.key.toLowerCase();
      if (key === 'm') toggleMute();
      else if (key === 'f') toggleFullscreen();
      else if (key === 'p' && document.pictureInPictureEnabled) pipBtn.click();
    });

    syncAudioUi();
    startWHEP();
  </script>
</body>
</html>
