<!DOCTYPE html>
<html lang="en" data-theme="light" data-motion="on">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GHOST SHARE JOR // VIEWER</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23F7F8FA'/%3E%3Crect x='0' y='0' width='16' height='1' fill='%23111111'/%3E%3Crect x='0' y='15' width='16' height='1' fill='%23111111'/%3E%3Crect x='0' y='0' width='1' height='16' fill='%23111111'/%3E%3Crect x='15' y='0' width='1' height='16' fill='%23111111'/%3E%3Crect x='5' y='2' width='6' height='1' fill='%23111111'/%3E%3Crect x='4' y='3' width='8' height='1' fill='%23111111'/%3E%3Crect x='3' y='4' width='10' height='6' fill='%23111111'/%3E%3Crect x='5' y='3' width='6' height='6' fill='%23FFFFFF'/%3E%3Crect x='4' y='4' width='8' height='5' fill='%23FFFFFF'/%3E%3Crect x='5' y='5' width='2' height='2' fill='%23111111'/%3E%3Crect x='9' y='5' width='2' height='2' fill='%23111111'/%3E%3Crect x='4' y='10' width='2' height='1' fill='%23111111'/%3E%3Crect x='7' y='10' width='2' height='1' fill='%23111111'/%3E%3Crect x='10' y='10' width='2' height='1' fill='%23111111'/%3E%3Crect x='7' y='12' width='2' height='1' fill='%23FF4130'/%3E%3Crect x='6' y='13' width='4' height='1' fill='%23FF4130'/%3E%3C/svg%3E">
  <style>
    /* Locked Architectural Pixel Design Tokens (Yoyu Design DNA)
     * Synced 1:1 with tokens.css and host-app/src/theme.h
     */
    :root {
      --paper-bg: #F7F8FA;
      --grid-line: #E4E7EE;
      --grid-major: #CBD1DF;
      --surface: #FFFFFF;
      --surface-muted: #EFF1F5;
      --surface-hud: rgba(255, 255, 255, 0.94);

      --ink: #111111;
      --ink-on-active: #FFFFFF;
      --ink-muted: #5E636E;
      --ink-subtle: #858890;

      --border: #D4D8E2;
      --border-strong: #111111;
      --shadow-ink: #111111;

      --ghost-outline: #111111;
      --ghost-fill: #FFFFFF;
      --ghost-eyes: #111111;
      --ghost-shadow: #CBD1DF;

      --accent: #FF4130;
      --mint: #00B894;
      --cyan: #0EA5E9;

      --video-canvas: #090A0D;

      --font-sans: "Yu Gothic UI", "Segoe UI Variable Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;

      --dur-micro: 120ms;
      --dur-hover: 160ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    :root[data-theme="dark"] {
      --paper-bg: #0E0F12;
      --grid-line: #181B22;
      --grid-major: #2B303C;
      --surface: #16181F;
      --surface-muted: #111318;
      --surface-hud: rgba(22, 24, 31, 0.94);

      --ink: #F2F4F8;
      --ink-on-active: #0E0F12;
      --ink-muted: #9DA4B4;
      --ink-subtle: #6E7585;

      --border: #272B36;
      --border-strong: #F2F4F8;
      --shadow-ink: #3B4252;

      --ghost-outline: #F2F4F8;
      --ghost-fill: #F2F4F8;
      --ghost-eyes: #0E0F12;
      --ghost-shadow: #060709;

      --accent: #FF4B3A;
      --mint: #00D2A0;
      --cyan: #38BDF8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-radius: 0 !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: var(--paper-bg);
      color: var(--ink);
      font-family: var(--font-sans);
      overflow: hidden;
      overflow-x: clip;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--video-canvas);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: var(--video-canvas);
      transition: opacity 280ms var(--ease-out);
    }

    video.cover {
      object-fit: cover;
    }

    /* Subtle edge scrims only when live video is playing */
    .hud-scrim-top,
    .hud-scrim-bottom {
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 12;
      opacity: 0;
      transition: opacity 240ms var(--ease-out);
    }

    .hud-scrim-top {
      top: 0;
      height: 88px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.45) 0%, transparent 100%);
    }

    .hud-scrim-bottom {
      bottom: 0;
      height: 104px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.55) 0%, transparent 100%);
    }

    .stage.is-live.hud-visible .hud-scrim-top,
    .stage.is-live.hud-visible .hud-scrim-bottom {
      opacity: 1;
    }

    .stage.hud-visible .top-hud,
    .stage.hud-visible .bottom-dock {
      opacity: 1;
      transform: translateY(0);
    }

    .stage.hud-idle {
      cursor: none;
    }

    /* Top Architectural Bar */
    .top-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 25;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
      pointer-events: none;
    }

    .top-hud > * {
      pointer-events: auto;
    }

    .brand-bar {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 12px;
      background: var(--surface-hud);
      border: 1px solid var(--border-strong);
      box-shadow: 3px 3px 0 var(--shadow-ink);
      min-width: 0;
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-name {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
    }

    .bar-sep {
      width: 1px;
      height: 14px;
      background: var(--border);
      flex-shrink: 0;
    }

    .room-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .top-right {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .telemetry-bar {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 12px;
      background: var(--surface-hud);
      border: 1px solid var(--border-strong);
      box-shadow: 3px 3px 0 var(--shadow-ink);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .telemetry-bar.hidden {
      display: none;
    }

    .stat-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .stat-label {
      color: var(--ink-subtle);
      text-transform: uppercase;
      font-size: 0.625rem;
      letter-spacing: 0.08em;
    }

    .stat-val {
      color: var(--ink);
      font-weight: 700;
    }

    .stat-val.good {
      color: var(--mint);
    }

    /* Compact Dark/Light + Motion Utility Cluster (Matches Ghost Mirror & Host App) */
    .utility-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .icon-toggle,
    .motion-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      background: var(--surface-hud);
      color: var(--ink);
      border: 1px solid var(--border-strong);
      box-shadow: 2px 2px 0 var(--shadow-ink);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition:
        transform var(--dur-hover) var(--ease-out),
        box-shadow var(--dur-hover) var(--ease-out),
        background var(--dur-micro) var(--ease-out),
        color var(--dur-micro) var(--ease-out);
    }

    .icon-toggle {
      width: 36px;
      padding: 0;
    }

    .motion-toggle {
      gap: 6px;
      padding: 0 10px;
      background: var(--ink);
      color: var(--ink-on-active);
      border-color: var(--ink);
    }

    :root[data-motion="off"] .motion-toggle {
      background: var(--surface-muted);
      color: var(--ink-muted);
      border-color: var(--border-strong);
    }

    .motion-dot {
      width: 6px;
      height: 6px;
      background: var(--mint);
      flex-shrink: 0;
    }

    :root[data-motion="off"] .motion-dot {
      background: var(--ink-subtle);
    }

    .icon-toggle:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--shadow-ink);
      background: var(--ink);
      color: var(--ink-on-active);
    }

    .motion-toggle:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--shadow-ink);
    }

    .icon-toggle:active,
    .motion-toggle:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--shadow-ink);
    }

    /* Tap to Unmute Architectural CTA */
    .unmute-cta {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 26;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 40px;
      padding: 0 18px;
      border: 1px solid var(--border-strong);
      background: var(--ink);
      color: var(--ink-on-active);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--accent);
      transition:
        transform var(--dur-hover) var(--ease-out),
        box-shadow var(--dur-hover) var(--ease-out),
        background var(--dur-micro) var(--ease-out);
    }

    .unmute-cta:hover {
      transform: translateX(-50%) translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--accent);
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    .unmute-cta:active {
      transform: translateX(-50%) translate(1px, 1px);
      box-shadow: 2px 2px 0 var(--shadow-ink);
    }

    .stage:not(.is-live) .unmute-cta,
    .unmute-cta.hidden {
      display: none;
    }

    /* Standby / Connecting / Interrupted Drafting Stage */
    .standby-overlay {
      position: absolute;
      inset: 0;
      z-index: 18;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 88px;
      background-color: var(--paper-bg);
      background-image:
        linear-gradient(to right, var(--grid-major) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-major) 1px, transparent 1px),
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 64px 64px, 64px 64px, 16px 16px, 16px 16px;
      background-position: center center;
      transition: opacity 280ms var(--ease-out), visibility 280ms;
    }

    .standby-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .standby-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 440px;
      padding: 28px 28px 24px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: 6px 6px 0 var(--shadow-ink);
    }

    /* Viewfinder Frame around Pixel Ghost Mascot (Zero ambient particle clutter) */
    .ghost-viewfinder {
      position: relative;
      width: 144px;
      height: 128px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      background-color: var(--paper-bg);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 16px 16px;
      border: 1px solid var(--border);
    }

    .vf-corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--border-strong);
      border-style: solid;
      pointer-events: none;
    }

    .vf-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .vf-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .vf-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .vf-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .ghost-mascot {
      width: 84px;
      height: 92px;
      image-rendering: pixelated;
      shape-rendering: crispEdges;
      animation: ghostStepFloat 2.2s steps(4, end) infinite;
    }

    :root[data-motion="off"] .ghost-mascot {
      animation: none;
    }

    @keyframes ghostStepFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .ghost-eyes-normal { display: block; }
    .ghost-eyes-blink  { display: none; }
    .ghost-eyes-error  { display: none; }

    .ghost-mascot.is-blinking .ghost-eyes-normal { display: none; }
    .ghost-mascot.is-blinking .ghost-eyes-blink  { display: block; }

    .stage.is-error .ghost-eyes-normal,
    .stage.is-error .ghost-eyes-blink { display: none; }
    .stage.is-error .ghost-eyes-error { display: block; }

    .standby-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 3px 10px;
      margin-bottom: 12px;
      border: 1px solid var(--border-strong);
      background: var(--surface-muted);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .kicker-sq {
      width: 7px;
      height: 7px;
      background: var(--cyan);
      flex-shrink: 0;
    }

    .stage.is-error .kicker-sq {
      background: var(--accent);
    }

    .stage.is-standby .kicker-sq {
      background: var(--ink-subtle);
    }

    .standby-title {
      font-family: var(--font-sans);
      font-size: clamp(1.25rem, 2.4vw, 1.5rem);
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--ink);
      margin-bottom: 8px;
      text-align: center;
    }

    .standby-desc {
      font-size: 0.875rem;
      color: var(--ink-muted);
      text-align: center;
      max-width: 340px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .standby-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: var(--surface-muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      color: var(--ink-muted);
    }

    .standby-meta strong {
      color: var(--ink);
      font-weight: 700;
    }

    /* Bottom Architectural Control Dock */
    .bottom-dock {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      background: var(--surface-hud);
      border: 1px solid var(--border-strong);
      box-shadow: 4px 4px 0 var(--shadow-ink);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
    }

    .dock-left,
    .dock-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--border-strong);
      background: var(--surface-muted);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .live-sq {
      width: 7px;
      height: 7px;
      background: var(--ink-subtle);
      flex-shrink: 0;
    }

    .stage.is-live .live-badge {
      background: var(--ink);
      color: var(--ink-on-active);
      border-color: var(--ink);
    }

    .stage.is-live .live-sq {
      background: var(--accent);
      animation: liveBlink 1.2s steps(2, end) infinite;
    }

    .stage.is-error .live-badge {
      border-color: var(--accent);
      color: var(--accent);
    }

    .stage.is-error .live-sq {
      background: var(--accent);
    }

    :root[data-motion="off"] .stage.is-live .live-sq {
      animation: none;
    }

    @keyframes liveBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .watch-timer {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      padding-left: 2px;
      white-space: nowrap;
    }

    .volume-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding-right: 10px;
      border: 1px solid var(--border);
      background: var(--surface-muted);
    }

    .volume-group .ctrl-btn {
      border: none;
      border-right: 1px solid var(--border);
      box-shadow: none;
      background: transparent;
      height: 30px;
    }

    .volume-group .ctrl-btn:hover {
      transform: none;
      box-shadow: none;
      background: var(--surface);
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 76px;
      height: 6px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 16px;
      background: var(--ink);
      border: 1px solid var(--border-strong);
      cursor: pointer;
      transition: background var(--dur-micro) var(--ease-out);
    }

    .volume-slider::-webkit-slider-thumb:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .volume-slider::-moz-range-thumb {
      width: 10px;
      height: 16px;
      background: var(--ink);
      border: 1px solid var(--border-strong);
      cursor: pointer;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 11px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition:
        transform var(--dur-hover) var(--ease-out),
        box-shadow var(--dur-hover) var(--ease-out),
        background var(--dur-micro) var(--ease-out),
        border-color var(--dur-micro) var(--ease-out),
        color var(--dur-micro) var(--ease-out);
    }

    .ctrl-btn:hover {
      border-color: var(--border-strong);
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0 var(--shadow-ink);
    }

    .ctrl-btn:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }

    .ctrl-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--ink-on-active);
    }

    .ctrl-btn:focus-visible,
    .unmute-cta:focus-visible,
    .icon-toggle:focus-visible,
    .motion-toggle:focus-visible,
    .volume-slider:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (max-width: 780px) {
      .telemetry-bar {
        display: none;
      }
      .room-tag {
        max-width: 120px;
      }
    }

    @media (max-width: 600px) {
      .top-hud {
        top: 10px;
        left: 10px;
        right: 10px;
        gap: 6px;
      }
      .brand-bar {
        padding: 0 8px;
        gap: 6px;
        height: 34px;
      }
      .brand-name {
        font-size: 0.65rem;
        letter-spacing: 0.06em;
      }
      .icon-toggle {
        width: 34px;
        height: 34px;
      }
      .motion-toggle {
        height: 34px;
        padding: 0 8px;
        font-size: 0.625rem;
      }
      .bar-sep,
      .room-tag {
        display: none;
      }
      .standby-overlay {
        padding: 60px 12px 72px;
      }
      .standby-card {
        padding: 20px 16px 16px;
      }
      .standby-meta {
        flex-wrap: wrap;
        gap: 6px;
        font-size: 0.66rem;
      }
      .bottom-dock {
        bottom: 10px;
        left: 10px;
        right: 10px;
        padding: 6px 8px;
        gap: 6px;
      }
      .dock-left,
      .dock-right {
        gap: 5px;
      }
      .live-badge {
        height: 30px;
        padding: 0 7px;
        font-size: 0.625rem;
      }
      .watch-timer,
      .volume-slider,
      .btn-label {
        display: none;
      }
      .volume-group {
        padding-right: 0;
        border: none;
        background: transparent;
      }
      .volume-group .ctrl-btn {
        border: 1px solid var(--border);
        background: var(--surface);
        height: 30px;
      }
      .ctrl-btn {
        height: 30px;
        width: 32px;
        padding: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <main class="stage hud-visible" id="stage">
    <video id="videoPlayer" playsinline autoplay muted></video>

    <div class="hud-scrim-top"></div>
    <div class="hud-scrim-bottom"></div>

    <!-- Top Architectural Studio Bar -->
    <header class="top-hud">
      <div class="brand-bar">
        <div class="brand-mark" aria-hidden="true">
          <!-- 8x8 Pixel Ghost Brand Mark -->
          <svg width="16" height="16" viewBox="0 0 8 8" shape-rendering="crispEdges">
            <rect x="2" y="0" width="4" height="1" fill="var(--ink)"/>
            <rect x="1" y="1" width="6" height="5" fill="var(--ink)"/>
            <rect x="2" y="1" width="4" height="4" fill="var(--surface)"/>
            <rect x="2" y="2" width="1" height="2" fill="var(--ink)"/>
            <rect x="5" y="2" width="1" height="2" fill="var(--ink)"/>
            <rect x="1" y="6" width="2" height="1" fill="var(--ink)"/>
            <rect x="5" y="6" width="2" height="1" fill="var(--ink)"/>
            <rect x="3" y="7" width="2" height="1" fill="var(--accent)"/>
          </svg>
        </div>
        <span class="brand-name">GHOST SHARE JOR</span>
        <span class="bar-sep"></span>
        <span class="room-tag" id="roomLabel">ROOM // default</span>
      </div>

      <div class="top-right">
        <div class="telemetry-bar" id="telemetryPill">
          <span class="stat-item"><span class="stat-label">RES</span> <span class="stat-val" id="statRes">--</span></span>
          <span class="bar-sep"></span>
          <span class="stat-item"><span class="stat-label">FPS</span> <span class="stat-val" id="statFps">--</span></span>
          <span class="bar-sep"></span>
          <span class="stat-item"><span class="stat-label">RATE</span> <span class="stat-val" id="statRate">--</span></span>
          <span class="bar-sep"></span>
          <span class="stat-item"><span class="stat-label">RTT</span> <span class="stat-val good" id="statRtt">--</span></span>
        </div>

        <!-- Compact Theme Toggle right next to MOTION (Matches Ghost Mirror & Host App) -->
        <div class="utility-group">
          <button class="icon-toggle" id="themeToggle" type="button" title="Toggle Dark / Light Blueprint (T)" aria-label="Toggle Dark or Light theme">
            <svg id="themeIconMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg id="themeIconSun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" style="display:none">
              <circle cx="12" cy="12" r="4"/>
              <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
              <line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/><line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/>
              <line x1="19.07" y1="4.93" x2="16.95" y2="7.05"/><line x1="7.05" y1="16.95" x2="4.93" y2="19.07"/>
            </svg>
          </button>

          <button class="motion-toggle" id="motionToggle" type="button" title="Toggle Motion / Static" aria-label="Toggle motion animations">
            <span class="motion-dot" aria-hidden="true"></span>
            <span id="motionLabel">MOTION</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Tap to Unmute Banner -->
    <button class="unmute-cta" id="unmuteBtn" type="button" aria-label="Unmute stream audio">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      TAP TO UNMUTE AUDIO
    </button>

    <!-- Standby / Connecting Architectural Stage -->
    <section class="standby-overlay" id="overlay" aria-live="polite">
      <div class="standby-card">
        <div class="ghost-viewfinder" aria-hidden="true">
          <span class="vf-corner vf-tl"></span>
          <span class="vf-corner vf-tr"></span>
          <span class="vf-corner vf-bl"></span>
          <span class="vf-corner vf-br"></span>

          <!-- Crisp 16x18 Pixel Ghost Mascot + Vermilion Prism -->
          <svg class="ghost-mascot" id="ghostMascot" viewBox="0 0 16 18" shape-rendering="crispEdges">
            <!-- Ground drop shadow -->
            <rect x="4" y="13" width="8" height="1" fill="var(--ghost-shadow)"/>
            <!-- Ghost Silhouette Outline -->
            <rect x="5" y="1" width="6" height="1" fill="var(--ghost-outline)"/>
            <rect x="4" y="2" width="8" height="1" fill="var(--ghost-outline)"/>
            <rect x="3" y="3" width="10" height="1" fill="var(--ghost-outline)"/>
            <rect x="2" y="4" width="12" height="7" fill="var(--ghost-outline)"/>
            <rect x="2" y="11" width="3" height="1" fill="var(--ghost-outline)"/>
            <rect x="6" y="11" width="4" height="1" fill="var(--ghost-outline)"/>
            <rect x="11" y="11" width="3" height="1" fill="var(--ghost-outline)"/>
            <rect x="3" y="12" width="1" height="1" fill="var(--ghost-outline)"/>
            <rect x="7" y="12" width="2" height="1" fill="var(--ghost-outline)"/>
            <rect x="12" y="12" width="1" height="1" fill="var(--ghost-outline)"/>
            <!-- Ghost Body Fill -->
            <rect x="5" y="2" width="6" height="1" fill="var(--ghost-fill)"/>
            <rect x="4" y="3" width="8" height="1" fill="var(--ghost-fill)"/>
            <rect x="3" y="4" width="10" height="7" fill="var(--ghost-fill)"/>
            <rect x="3" y="11" width="1" height="1" fill="var(--ghost-fill)"/>
            <rect x="7" y="11" width="2" height="1" fill="var(--ghost-fill)"/>
            <rect x="12" y="11" width="1" height="1" fill="var(--ghost-fill)"/>

            <!-- Normal Eyes (track mouse cursor subtly) -->
            <g class="ghost-eyes-normal" id="ghostEyesNormal">
              <rect x="5" y="6" width="2" height="2" fill="var(--ghost-eyes)"/>
              <rect x="9" y="6" width="2" height="2" fill="var(--ghost-eyes)"/>
            </g>

            <!-- Blink Eyes -->
            <g class="ghost-eyes-blink">
              <rect x="5" y="7" width="2" height="1" fill="var(--ghost-eyes)"/>
              <rect x="9" y="7" width="2" height="1" fill="var(--ghost-eyes)"/>
            </g>

            <!-- Error / Interrupted X_X Eyes -->
            <g class="ghost-eyes-error">
              <rect x="4" y="5" width="1" height="1" fill="var(--accent)"/>
              <rect x="6" y="5" width="1" height="1" fill="var(--accent)"/>
              <rect x="5" y="6" width="1" height="1" fill="var(--accent)"/>
              <rect x="4" y="7" width="1" height="1" fill="var(--accent)"/>
              <rect x="6" y="7" width="1" height="1" fill="var(--accent)"/>
              <rect x="9" y="5" width="1" height="1" fill="var(--accent)"/>
              <rect x="11" y="5" width="1" height="1" fill="var(--accent)"/>
              <rect x="10" y="6" width="1" height="1" fill="var(--accent)"/>
              <rect x="9" y="7" width="1" height="1" fill="var(--accent)"/>
              <rect x="11" y="7" width="1" height="1" fill="var(--accent)"/>
              <rect x="6" y="9" width="4" height="1" fill="var(--ghost-eyes)"/>
            </g>

            <!-- Signature Vermilion Prism Base -->
            <rect x="7" y="15" width="2" height="1" fill="var(--accent)"/>
            <rect x="6" y="16" width="4" height="1" fill="var(--accent)"/>
            <rect x="5" y="17" width="6" height="1" fill="var(--accent)"/>
          </svg>
        </div>

        <div class="standby-kicker">
          <span class="kicker-sq" aria-hidden="true"></span>
          <span id="statusKicker">WEBRTC // WHEP</span>
        </div>
        <h1 class="standby-title" id="statusTitle">Connecting to Room</h1>
        <p class="standby-desc" id="statusDesc">Establishing low-latency peer handshake with media server...</p>
        <div class="standby-meta">
          <span id="standbyMeta">ROOM // default</span>
          <span id="retryMeta">AUTO-RETRY 1.2S</span>
        </div>
      </div>
    </section>

    <!-- Bottom Architectural Control Dock -->
    <footer class="bottom-dock">
      <div class="dock-left">
        <div class="live-badge">
          <span class="live-sq" aria-hidden="true"></span>
          <span id="liveText">STANDBY</span>
        </div>
        <span class="watch-timer" id="watchTimer">00:00</span>
      </div>

      <div class="dock-right">
        <div class="volume-group">
          <button class="ctrl-btn" id="audioToggle" type="button" aria-label="Toggle mute (M)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            <span class="btn-label">Unmute</span>
          </button>
          <input class="volume-slider" id="volumeSlider" type="range" min="0" max="1" step="0.02" value="1" aria-label="Stream volume">
        </div>

        <button class="ctrl-btn" id="fitBtn" type="button" title="Toggle Fit / Fill" aria-label="Toggle video fit mode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><rect x="3" y="5" width="18" height="14"/><path d="M7 15l3-3 2 2 5-5"/></svg>
          <span class="btn-label" id="fitLabel">Fit</span>
        </button>

        <button class="ctrl-btn" id="statsBtn" type="button" title="Toggle Telemetry" aria-label="Toggle stream stats">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 3 5-6"/></svg>
          <span class="btn-label">Stats</span>
        </button>

        <button class="ctrl-btn" id="pipBtn" type="button" title="Picture in Picture (P)" aria-label="Picture in Picture">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><rect x="2" y="4" width="20" height="16"/><rect x="12" y="11" width="7" height="5"/></svg>
          <span class="btn-label">PiP</span>
        </button>

        <button class="ctrl-btn" id="fullscreenBtn" type="button" title="Fullscreen (F)" aria-label="Toggle fullscreen">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 3H3v5M21 8V3h-5M16 21h5v-5M3 16v5h5"/></svg>
          <span class="btn-label">Full</span>
        </button>
      </div>
    </footer>
  </main>

  <script>
    // Extract room id from URL: /r/{room_id} or ?room={room_id}
    const urlParams = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    let roomId = pathParts[pathParts.length - 1] || '';
    if (!roomId || roomId === 'r' || roomId.toLowerCase().endsWith('.html')) {
      roomId = urlParams.get('room') || 'default';
    }
    document.getElementById('roomLabel').textContent = `ROOM // ${roomId}`;
    document.getElementById('standbyMeta').innerHTML = `ROOM // <strong>${roomId.replace(/[<>&"']/g, '')}</strong>`;

    const rootEl = document.documentElement;
    const stage = document.getElementById('stage');
    const video = document.getElementById('videoPlayer');
    const overlay = document.getElementById('overlay');
    const statusKicker = document.getElementById('statusKicker');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const unmuteBtn = document.getElementById('unmuteBtn');
    const audioToggle = document.getElementById('audioToggle');
    const volumeSlider = document.getElementById('volumeSlider');
    const fitBtn = document.getElementById('fitBtn');
    const fitLabel = document.getElementById('fitLabel');
    const statsBtn = document.getElementById('statsBtn');
    const telemetryPill = document.getElementById('telemetryPill');
    const pipBtn = document.getElementById('pipBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const watchTimer = document.getElementById('watchTimer');
    const liveText = document.getElementById('liveText');

    const themeToggle = document.getElementById('themeToggle');
    const themeIconMoon = document.getElementById('themeIconMoon');
    const themeIconSun = document.getElementById('themeIconSun');
    const motionToggle = document.getElementById('motionToggle');
    const motionLabel = document.getElementById('motionLabel');
    const ghostMascot = document.getElementById('ghostMascot');
    const ghostEyesNormal = document.getElementById('ghostEyesNormal');

    const statRes = document.getElementById('statRes');
    const statFps = document.getElementById('statFps');
    const statRate = document.getElementById('statRate');
    const statRtt = document.getElementById('statRtt');

    // Theme (Light Paper / Dark Blueprint) + Motion State
    function applyTheme(theme) {
      const isDark = theme === 'dark';
      rootEl.setAttribute('data-theme', isDark ? 'dark' : 'light');
      themeIconMoon.style.display = isDark ? 'none' : 'block';
      themeIconSun.style.display = isDark ? 'block' : 'none';
      try { localStorage.setItem('gsj-theme', isDark ? 'dark' : 'light'); } catch (_) {}
    }

    function applyMotion(enabled) {
      rootEl.setAttribute('data-motion', enabled ? 'on' : 'off');
      motionLabel.textContent = enabled ? 'MOTION' : 'STATIC';
      if (!enabled) ghostEyesNormal.setAttribute('transform', 'translate(0, 0)');
      try { localStorage.setItem('gsj-motion', enabled ? 'on' : 'off'); } catch (_) {}
    }

    const queryTheme = urlParams.get('theme');
    let savedTheme = 'light';
    let savedMotion = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    try {
      const t = localStorage.getItem('gsj-theme');
      if (t === 'dark' || t === 'light') savedTheme = t;
      const m = localStorage.getItem('gsj-motion');
      if (m === 'on' || m === 'off') savedMotion = (m === 'on');
    } catch (_) {}
    if (queryTheme === 'dark' || queryTheme === 'light') savedTheme = queryTheme;
    applyTheme(savedTheme);
    applyMotion(savedMotion);

    themeToggle.addEventListener('click', () => {
      const next = rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    });

    motionToggle.addEventListener('click', () => {
      const next = rootEl.getAttribute('data-motion') !== 'on';
      applyMotion(next);
    });

    // Subtle quantized pixel eye-tracking & natural blink while Standby is visible
    setInterval(() => {
      if (overlay.classList.contains('hidden') || rootEl.getAttribute('data-motion') !== 'on') return;
      ghostMascot.classList.add('is-blinking');
      setTimeout(() => ghostMascot.classList.remove('is-blinking'), 130);
    }, 3800);

    window.addEventListener('mousemove', (e) => {
      if (overlay.classList.contains('hidden') || rootEl.getAttribute('data-motion') !== 'on') return;
      const rect = ghostMascot.getBoundingClientRect();
      const cx = rect.left + rect.width * 0.5;
      const cy = rect.top + rect.height * 0.45;
      const dx = Math.max(-1, Math.min(1, Math.round((e.clientX - cx) / 140)));
      const dy = Math.max(-1, Math.min(1, Math.round((e.clientY - cy) / 140)));
      ghostEyesNormal.setAttribute('transform', `translate(${dx}, ${dy})`);
    }, { passive: true });

    const whepEndpoint = `${window.location.origin}/${roomId}/whep`;
    const retryMeta = document.getElementById('retryMeta');

    let pc = null;
    let sessionGen = 0;
    let retryTimeout = null;
    let firstFrameTimeout = null;
    let muteStallTimeout = null;
    let statsInterval = null;
    let timerInterval = null;
    let connectedAt = 0;
    let prevBytesReceived = 0;
    let prevFramesDecoded = 0;
    let frozenTicks = 0;
    let prevStatsTime = 0;
    let idleTimeout = null;
    let statsVisible = true;
    let hasRenderedFrame = false;

    statsBtn.classList.add('active');
    if (!document.pictureInPictureEnabled) {
      pipBtn.style.display = 'none';
    }

    function clearVideoStream() {
      hasRenderedFrame = false;
      clearTimeout(firstFrameTimeout);
      clearTimeout(muteStallTimeout);
      if (video.srcObject) {
        try {
          video.srcObject.getTracks().forEach((t) => t.stop());
        } catch (_) {}
        video.srcObject = null;
      }
    }

    function markLiveWithFrame() {
      if (hasRenderedFrame) return;
      if (video.videoWidth === 0 && video.readyState < 2) return;
      hasRenderedFrame = true;
      clearTimeout(firstFrameTimeout);
      clearTimeout(muteStallTimeout);
      stage.classList.remove('is-error', 'is-standby');
      stage.classList.add('is-live');
      liveText.textContent = 'LIVE';
      overlay.classList.add('hidden');
      startWatchTimer();
      startStatsPolling();
      wakeHud();
    }

    video.addEventListener('loadeddata', markLiveWithFrame);
    video.addEventListener('playing', markLiveWithFrame);
    video.addEventListener('resize', () => {
      if (video.videoWidth > 0) markLiveWithFrame();
    });

    function wakeHud() {
      stage.classList.add('hud-visible');
      stage.classList.remove('hud-idle');
      clearTimeout(idleTimeout);
      if (overlay.classList.contains('hidden')) {
        idleTimeout = setTimeout(() => {
          stage.classList.remove('hud-visible');
          stage.classList.add('hud-idle');
        }, 2800);
      }
    }

    stage.addEventListener('mousemove', wakeHud);
    stage.addEventListener('touchstart', wakeHud, { passive: true });
    stage.addEventListener('click', wakeHud);

    function formatElapsed(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function startWatchTimer() {
      connectedAt = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        watchTimer.textContent = formatElapsed(Date.now() - connectedAt);
      }, 1000);
    }

    function stopWatchTimer() {
      clearInterval(timerInterval);
      watchTimer.textContent = '00:00';
    }

    function startStatsPolling() {
      clearInterval(statsInterval);
      prevBytesReceived = 0;
      prevFramesDecoded = 0;
      frozenTicks = 0;
      prevStatsTime = 0;
      const myGen = sessionGen;
      statsInterval = setInterval(async () => {
        if (myGen !== sessionGen || !pc || pc.connectionState !== 'connected') return;
        try {
          const stats = await pc.getStats();
          let rttMs = null;
          let sawVideo = false;
          stats.forEach((report) => {
            if (report.type === 'inbound-rtp' && report.kind === 'video') {
              sawVideo = true;
              if (report.frameWidth && report.frameHeight) {
                statRes.textContent = `${report.frameWidth}x${report.frameHeight}`;
              }
              if (typeof report.framesPerSecond === 'number') {
                statFps.textContent = `${Math.round(report.framesPerSecond)} fps`;
              }
              const now = report.timestamp;
              if (prevStatsTime > 0 && now > prevStatsTime && report.bytesReceived >= prevBytesReceived) {
                const mbps = ((report.bytesReceived - prevBytesReceived) * 8) / ((now - prevStatsTime) * 1000);
                statRate.textContent = `${mbps.toFixed(1)} Mbps`;
              }
              const frames = report.framesDecoded || 0;
              if (frames > prevFramesDecoded) {
                frozenTicks = 0;
                if (!hasRenderedFrame && video.videoWidth > 0) markLiveWithFrame();
              } else {
                frozenTicks++;
              }
              prevFramesDecoded = frames;
              prevBytesReceived = report.bytesReceived;
              prevStatsTime = now;
            }
            if (report.type === 'candidate-pair' && report.state === 'succeeded' && typeof report.currentRoundTripTime === 'number') {
              rttMs = Math.round(report.currentRoundTripTime * 1000);
            }
          });
          if (rttMs !== null) {
            statRtt.textContent = `${rttMs} ms`;
          }
          // If host restarted (e.g., bitrate/resolution switch) and video stalled for 3s, reconnect immediately
          if (sawVideo && frozenTicks >= 3) {
            triggerReconnect('STREAM UPDATED', 'Reconnecting to Host', 'Host changed stream settings. Re-syncing feed...', 600);
          }
        } catch (_) {}
      }, 1000);
    }

    function stopStatsPolling() {
      clearInterval(statsInterval);
      statRes.textContent = '--';
      statFps.textContent = '--';
      statRate.textContent = '--';
      statRtt.textContent = '--';
    }

    function triggerReconnect(kicker, title, desc, delayMs = 1200) {
      if (pc) {
        try { pc.close(); } catch (_) {}
        pc = null;
      }
      clearVideoStream();
      stopStatsPolling();
      stopWatchTimer();
      stage.classList.remove('is-live', 'is-standby');
      stage.classList.add('is-error');
      liveText.textContent = 'RECONNECT';
      statusKicker.textContent = kicker;
      statusTitle.textContent = title;
      statusDesc.textContent = desc;
      retryMeta.textContent = `RETRYING IN ${(delayMs / 1000).toFixed(1)}S`;
      overlay.classList.remove('hidden');
      wakeHud();
      scheduleRetry(delayMs);
    }

    async function startWHEP() {
      clearTimeout(retryTimeout);
      const myGen = ++sessionGen;

      if (pc) {
        try { pc.close(); } catch (_) {}
        pc = null;
      }
      clearVideoStream();
      stopStatsPolling();
      stopWatchTimer();
      stage.classList.remove('is-live', 'is-error', 'is-standby');
      liveText.textContent = 'CONNECT';

      statusKicker.textContent = 'WEBRTC // WHEP';
      statusTitle.textContent = 'Connecting to Room';
      statusDesc.textContent = `Establishing low-latency handshake for "${roomId}"...`;
      retryMeta.textContent = 'HANDSHAKING...';
      overlay.classList.remove('hidden');
      wakeHud();

      const currentPc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });
      pc = currentPc;

      // Fresh MediaStream per connection so dead tracks from previous sessions never cause black screen
      const sessionStream = new MediaStream();

      currentPc.addTransceiver('video', { direction: 'recvonly' });
      currentPc.addTransceiver('audio', { direction: 'recvonly' });

      currentPc.ontrack = (event) => {
        if (myGen !== sessionGen) return;
        const track = event.track;
        if (!sessionStream.getTracks().includes(track)) {
          sessionStream.addTrack(track);
        }
        if (video.srcObject !== sessionStream) {
          video.srcObject = sessionStream;
        }
        if (track.kind === 'video') {
          track.onunmute = () => {
            if (myGen !== sessionGen) return;
            clearTimeout(muteStallTimeout);
            video.play().catch(() => {});
            if (video.videoWidth > 0) markLiveWithFrame();
          };
          track.onmute = () => {
            if (myGen !== sessionGen) return;
            clearTimeout(muteStallTimeout);
            muteStallTimeout = setTimeout(() => {
              if (myGen === sessionGen && track.muted) {
                triggerReconnect('STREAM INTERRUPTED', 'Re-syncing Video', 'Host restarted or paused stream. Reconnecting...', 800);
              }
            }, 2200);
          };
          track.onended = () => {
            if (myGen !== sessionGen) return;
            triggerReconnect('STREAM ENDED', 'Host Reconnecting', 'Host ended or updated stream. Reconnecting...', 800);
          };
        }
        video.play().catch(() => {});
      };

      const handleConnState = () => {
        if (myGen !== sessionGen || pc !== currentPc) return;
        const st = currentPc.connectionState;
        const ice = currentPc.iceConnectionState;
        if (st === 'connected' || ice === 'connected' || ice === 'completed') {
          statusKicker.textContent = 'SYNCING VIDEO';
          statusTitle.textContent = 'Waiting for Keyframe';
          statusDesc.textContent = 'Connected to server. Waiting for first video frame...';
          retryMeta.textContent = 'ICE CONNECTED';
          video.play().catch(() => {});
          if (video.videoWidth > 0 && video.readyState >= 2) {
            markLiveWithFrame();
          } else {
            clearTimeout(firstFrameTimeout);
            firstFrameTimeout = setTimeout(() => {
              if (myGen === sessionGen && !hasRenderedFrame) {
                triggerReconnect('NO VIDEO FRAME', 'Re-syncing Stream', 'No video keyframe received yet. Retrying...', 900);
              }
            }, 4500);
          }
        } else if (st === 'failed' || st === 'disconnected' || ice === 'failed' || ice === 'disconnected') {
          triggerReconnect('SIGNAL INTERRUPTED', 'Host Disconnected', 'Waiting for host to resume sharing. Reconnecting...', 1200);
        }
      };

      currentPc.onconnectionstatechange = handleConnState;
      currentPc.oniceconnectionstatechange = handleConnState;

      try {
        const offer = await currentPc.createOffer();
        if (myGen !== sessionGen) return;
        await currentPc.setLocalDescription(offer);

        await new Promise((resolve) => {
          if (currentPc.iceGatheringState === 'complete') {
            resolve();
          } else {
            const checkState = () => {
              if (currentPc.iceGatheringState === 'complete') {
                currentPc.removeEventListener('icegatheringstatechange', checkState);
                resolve();
              }
            };
            currentPc.addEventListener('icegatheringstatechange', checkState);
            setTimeout(resolve, 650);
          }
        });
        if (myGen !== sessionGen) return;

        const res = await fetch(whepEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/sdp' },
          body: currentPc.localDescription.sdp
        });
        if (myGen !== sessionGen) return;

        if (!res.ok) {
          throw new Error(`WHEP Server responded with status ${res.status}`);
        }

        const answerSdp = await res.text();
        if (myGen !== sessionGen) return;
        await currentPc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
        video.play().catch(() => {});
      } catch (err) {
        if (myGen !== sessionGen) return;
        if (pc === currentPc) {
          try { pc.close(); } catch (_) {}
          pc = null;
        }
        clearVideoStream();
        stage.classList.remove('is-live', 'is-error');
        stage.classList.add('is-standby');
        liveText.textContent = 'STANDBY';
        statusKicker.textContent = 'STANDBY MODE';
        statusTitle.textContent = 'Waiting for Host';
        statusDesc.textContent = 'Screen share is not live yet. Automatically retrying...';
        retryMeta.textContent = 'AUTO-RETRY 1.2S';
        overlay.classList.remove('hidden');
        scheduleRetry(1200);
      }
    }

    function scheduleRetry(delayMs = 1200) {
      clearTimeout(retryTimeout);
      retryTimeout = setTimeout(startWHEP, delayMs);
    }

    const iconSoundOn = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
    const iconSoundOff = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;

    function syncAudioUi() {
      if (video.muted || video.volume === 0) {
        audioToggle.innerHTML = `${iconSoundOff}<span class="btn-label">Unmute</span>`;
      } else {
        unmuteBtn.classList.add('hidden');
        audioToggle.innerHTML = `${iconSoundOn}<span class="btn-label">Mute</span>`;
      }
    }

    function unmuteStream() {
      video.muted = false;
      if (video.volume === 0) {
        video.volume = 1;
        volumeSlider.value = '1';
      }
      video.play().then(syncAudioUi).catch(console.error);
    }

    function toggleMute() {
      video.muted = !video.muted;
      if (!video.muted && video.volume === 0) {
        video.volume = 1;
        volumeSlider.value = '1';
      }
      syncAudioUi();
    }

    unmuteBtn.addEventListener('click', unmuteStream);
    audioToggle.addEventListener('click', toggleMute);

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      video.volume = val;
      video.muted = (val === 0);
      syncAudioUi();
    });

    fitBtn.addEventListener('click', () => {
      const isCover = video.classList.toggle('cover');
      fitLabel.textContent = isCover ? 'Fill' : 'Fit';
      fitBtn.classList.toggle('active', isCover);
    });

    statsBtn.addEventListener('click', () => {
      statsVisible = !statsVisible;
      telemetryPill.classList.toggle('hidden', !statsVisible);
      statsBtn.classList.toggle('active', statsVisible);
    });

    pipBtn.addEventListener('click', async () => {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        console.error(err);
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        stage.requestFullscreen().catch(console.error);
      } else {
        document.exitFullscreen().catch(console.error);
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      const key = e.key.toLowerCase();
      if (key === 'm') toggleMute();
      else if (key === 'f') toggleFullscreen();
      else if (key === 't') themeToggle.click();
      else if (key === 'p' && document.pictureInPictureEnabled) pipBtn.click();
    });

    syncAudioUi();
    startWHEP();
  </script>
</body>
</html>
