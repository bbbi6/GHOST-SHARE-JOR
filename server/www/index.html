<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ghost share jor — broadcast viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/tokens.css">
  <style>
    /* Hallmark · genre: atmospheric · macrostructure: Workbench · theme: lumen · drop: night · design-system: design.md · designed-as-app */
    /* Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overflow-x: clip;
      background-color: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: grid;
      place-items: center;
      background-color: var(--color-paper);
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background-color: var(--color-paper);
    }

    video.cover {
      object-fit: cover;
    }

    .mono-label {
      font-family: var(--font-label);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* Top Edge-Aligned Instrument Bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background-color: var(--color-paper-2);
      border-bottom: 1px solid var(--color-rule);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
      pointer-events: none;
    }

    .stage.hud-visible .top-bar,
    .stage:focus-within .top-bar {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .brand-group {
      display: inline-flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
    }

    .emitter-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--color-muted);
      flex-shrink: 0;
      transition: background-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
    }

    .stage.is-live .emitter-dot {
      background-color: var(--color-accent);
      box-shadow: 0 0 8px var(--color-glow);
    }

    .brand-title {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-ink);
      text-transform: lowercase;
      line-height: 1;
      white-space: nowrap;
    }

    .room-chip {
      color: var(--color-muted);
      padding-left: var(--space-3);
      border-left: 1px solid var(--color-rule);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .telemetry-strip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-4);
      flex-shrink: 0;
    }

    .telemetry-strip.hidden {
      display: none;
    }

    .stat-pair {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
    }

    .stat-key {
      color: var(--color-muted);
    }

    .stat-val {
      color: var(--color-ink);
    }

    .stat-val.is-brass {
      color: var(--color-accent);
    }

    /* Unmute Action Bar */
    .unmute-pill {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-accent);
      background-color: var(--color-paper-2);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      text-transform: lowercase;
      line-height: 1;
      cursor: pointer;
      transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }

    .unmute-pill:hover {
      background-color: var(--color-paper-emit);
      color: var(--color-accent);
    }

    .unmute-pill:focus-visible {
      outline: 1px solid var(--color-focus);
      outline-offset: 2px;
    }

    .unmute-pill:active {
      background-color: var(--color-paper-3);
    }

    .unmute-pill.hidden {
      display: none;
    }

    /* Standby Instrument Canvas */
    .standby-overlay {
      position: absolute;
      inset: 0;
      z-index: 18;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background-color: var(--color-paper);
      background-image:
        linear-gradient(to right, var(--rule-blueprint) 1px, transparent 1px),
        linear-gradient(to bottom, var(--rule-blueprint) 1px, transparent 1px);
      background-size: 32px 32px;
      transition: opacity var(--dur-med) var(--ease-out), visibility var(--dur-med) var(--ease-out);
    }

    .standby-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .standby-frame {
      width: 100%;
      max-width: 640px;
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-md);
      background-color: var(--color-paper-2);
      padding: var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    .standby-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--color-rule);
    }

    .standby-kicker {
      color: var(--color-accent);
    }

    .standby-room {
      color: var(--color-muted);
    }

    .standby-title {
      font-family: var(--font-display);
      font-size: var(--text-hero);
      font-weight: 400;
      font-style: normal;
      line-height: 1.08;
      letter-spacing: -0.01em;
      color: var(--color-ink);
      text-transform: lowercase;
      max-width: 18ch;
    }

    .verb-accent {
      color: var(--color-accent-2);
      border-bottom: 1px solid var(--color-accent-2);
      padding-bottom: 2px;
    }

    .standby-desc {
      font-size: var(--text-base);
      color: var(--color-ink-2);
      text-transform: lowercase;
      max-width: 52ch;
    }

    /* Hand-Built Signal Chain Apparatus */
    .apparatus-box {
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-sm);
      background-color: var(--color-paper);
      padding: var(--space-4);
    }

    .apparatus-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .standby-callouts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--color-rule);
      color: var(--color-muted);
    }

    /* Bottom Workbench Dock */
    .bottom-dock {
      position: absolute;
      left: var(--space-4);
      right: var(--space-4);
      bottom: var(--space-4);
      z-index: 20;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      background-color: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
      pointer-events: none;
    }

    .stage.hud-visible .bottom-dock,
    .stage:focus-within .bottom-dock {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Real-Data Meter Strip */
    .meter-strip {
      display: grid;
      grid-template-columns: repeat(64, 1fr);
      align-items: end;
      gap: 3px;
      height: 18px;
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--color-rule);
    }

    .meter-tick {
      width: 100%;
      min-height: 2px;
      height: 2px;
      background-color: var(--color-rule-2);
      transition: height var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
    }

    .meter-tick.active {
      background-color: var(--color-accent);
    }

    .dock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      min-height: 32px;
    }

    .dock-group {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      height: 30px;
      padding: 0 var(--space-3);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-rule);
      background-color: var(--color-paper-3);
      color: var(--color-ink-2);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      text-transform: lowercase;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
    }

    .ctrl-btn:hover {
      border-color: var(--color-rule-2);
      color: var(--color-ink);
    }

    .ctrl-btn:focus-visible {
      outline: 1px solid var(--color-focus);
      outline-offset: 2px;
    }

    .ctrl-btn:active {
      background-color: var(--color-paper);
    }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .ctrl-btn.active {
      border-color: var(--color-accent);
      color: var(--color-accent);
      background-color: var(--color-paper-emit);
    }

    .volume-wrap {
      display: inline-flex;
      align-items: center;
      padding: 0 var(--space-2);
    }

    input[type="range"].volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 72px;
      height: 2px;
      background-color: var(--color-rule-2);
      outline: none;
      cursor: pointer;
    }

    input[type="range"].volume-slider:focus-visible {
      outline: 1px solid var(--color-focus);
      outline-offset: 4px;
    }

    input[type="range"].volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 14px;
      border-radius: 1px;
      background-color: var(--color-accent);
      border: 1px solid var(--color-paper);
      cursor: pointer;
    }

    .watch-timer {
      color: var(--color-muted);
      padding: 0 var(--space-2);
    }

    .stage.hud-idle {
      cursor: none;
    }

    @media (max-width: 640px) {
      .room-chip,
      .volume-wrap,
      .watch-timer,
      .telemetry-strip .stat-pair:nth-child(n+3) {
        display: none;
      }

      .meter-strip {
        grid-template-columns: repeat(32, 1fr);
      }

      .meter-tick:nth-child(n+33) {
        display: none;
      }

      .btn-label {
        display: none;
      }

      .ctrl-btn {
        padding: 0 var(--space-2);
      }

      .standby-frame {
        padding: var(--space-4);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage hud-visible" id="stage">
    <video id="videoPlayer" autoplay playsinline muted></video>

    <!-- Edge-Aligned Top Bar -->
    <header class="top-bar">
      <div class="brand-group">
        <span class="emitter-dot" aria-hidden="true"></span>
        <span class="brand-title">ghost share jor</span>
        <span class="room-chip mono-label" id="roomLabel">ROOM / DEFAULT</span>
      </div>

      <div class="telemetry-strip mono-label" id="telemetryPill">
        <span class="stat-pair"><span class="stat-key">RES</span><span class="stat-val" id="statRes">--</span></span>
        <span class="stat-pair"><span class="stat-key">FPS</span><span class="stat-val" id="statFps">--</span></span>
        <span class="stat-pair"><span class="stat-key">RATE</span><span class="stat-val is-brass" id="statRate">--</span></span>
        <span class="stat-pair"><span class="stat-key">RTT</span><span class="stat-val" id="statRtt">--</span></span>
      </div>
    </header>

    <!-- Tap to Unmute -->
    <button class="unmute-pill" id="unmuteBtn" type="button" aria-label="unmute broadcast audio">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
      <span>click to unmute stream</span>
    </button>

    <!-- Standby Apparatus Overlay -->
    <section class="standby-overlay" id="overlay" aria-live="polite">
      <div class="standby-frame">
        <div class="standby-header">
          <span class="standby-kicker mono-label" id="statusKicker">STANDBY · WHEP RECEIVER</span>
          <span class="standby-room mono-label" id="standbyMeta">ROOM · DEFAULT</span>
        </div>

        <h1 class="standby-title" id="statusTitle">waiting for the host to <span class="verb-accent">go</span> live.</h1>
        <p class="standby-desc" id="statusDesc">screen share is not live yet. polling whep endpoint every 3 seconds.</p>

        <div class="apparatus-box">
          <svg class="apparatus-svg" viewBox="0 0 560 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="webrtc signal chain diagram from capture to encode to whip to room">
            <line x1="68" y1="38" x2="178" y2="38" stroke="rgba(241,241,245,0.16)" stroke-width="1"/>
            <line x1="226" y1="38" x2="334" y2="38" stroke="rgba(241,241,245,0.16)" stroke-width="1"/>
            <line x1="382" y1="38" x2="492" y2="38" stroke="rgba(241,241,245,0.16)" stroke-width="1"/>

            <!-- Node 1: CAPTURE -->
            <rect x="12" y="22" width="56" height="32" rx="2" fill="#12121b" stroke="rgba(241,241,245,0.16)" stroke-width="1"/>
            <text x="40" y="41" text-anchor="middle" fill="#b6b7c0" font-family="JetBrains Mono, Consolas, monospace" font-size="9" letter-spacing="1">CAPTURE</text>

            <!-- Node 2: ENCODE -->
            <rect x="178" y="22" width="48" height="32" rx="2" fill="#12121b" stroke="rgba(241,241,245,0.16)" stroke-width="1"/>
            <text x="202" y="41" text-anchor="middle" fill="#b6b7c0" font-family="JetBrains Mono, Consolas, monospace" font-size="9" letter-spacing="1">H264</text>

            <!-- Node 3: WHIP -->
            <rect x="334" y="22" width="48" height="32" rx="2" fill="#12121b" stroke="rgba(241,241,245,0.16)" stroke-width="1"/>
            <text x="358" y="41" text-anchor="middle" fill="#b6b7c0" font-family="JetBrains Mono, Consolas, monospace" font-size="9" letter-spacing="1">WHIP</text>

            <!-- Node 4: ROOM (Brass Active Target) -->
            <rect x="492" y="22" width="56" height="32" rx="2" fill="rgba(242,156,56,0.06)" stroke="#f29c38" stroke-width="1"/>
            <text x="520" y="41" text-anchor="middle" fill="#f29c38" font-family="JetBrains Mono, Consolas, monospace" font-size="9" letter-spacing="1">WHEP</text>

            <!-- Leader Callouts -->
            <line x1="202" y1="54" x2="202" y2="72" stroke="rgba(241,241,245,0.14)" stroke-width="1"/>
            <text x="202" y="84" text-anchor="middle" fill="#858691" font-family="JetBrains Mono, Consolas, monospace" font-size="8" letter-spacing="1">LOW-LATENCY</text>

            <line x1="520" y1="54" x2="520" y2="72" stroke="rgba(242,156,56,0.45)" stroke-width="1"/>
            <text x="520" y="84" text-anchor="middle" fill="#f29c38" font-family="JetBrains Mono, Consolas, monospace" font-size="8" letter-spacing="1">LISTENING</text>
          </svg>
        </div>

        <div class="standby-callouts mono-label">
          <span>PROTO · WEBRTC WHEP</span>
          <span>RETRY · 3 S</span>
          <span>AUDIO · OPUS 48KHZ</span>
        </div>
      </div>
    </section>

    <!-- Bottom Workbench Dock -->
    <footer class="bottom-dock">
      <div class="meter-strip" id="meterStrip" aria-hidden="true"></div>

      <div class="dock-row">
        <div class="dock-group">
          <button class="ctrl-btn" id="audioToggle" type="button" title="mute or unmute (m)" aria-label="toggle mute">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            <span class="btn-label">unmute</span>
          </button>

          <div class="volume-wrap">
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.02" value="1" aria-label="volume">
          </div>

          <span class="watch-timer mono-label" id="watchTimer">00:00</span>
        </div>

        <div class="dock-group">
          <button class="ctrl-btn" id="fitBtn" type="button" title="toggle fit or fill" aria-label="toggle video aspect fit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M8 9H6v2m10-2h2v2m-10 4H6v-2m10 2h2v-2"/></svg>
            <span class="btn-label" id="fitLabel">fit</span>
          </button>

          <button class="ctrl-btn" id="statsBtn" type="button" title="toggle telemetry" aria-label="toggle telemetry">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
            <span class="btn-label">stats</span>
          </button>

          <button class="ctrl-btn" id="pipBtn" type="button" title="picture in picture (p)" aria-label="picture in picture">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="1"/><rect x="12" y="11" width="7" height="5" rx="1"/></svg>
            <span class="btn-label">pip</span>
          </button>

          <button class="ctrl-btn" id="fullscreenBtn" type="button" title="fullscreen (f)" aria-label="toggle fullscreen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            <span class="btn-label">full</span>
          </button>
        </div>
      </div>
    </footer>
  </main>

  <script>
    // Extract room id from URL: /r/{room_id} or ?room={room_id}
    const pathParts = window.location.pathname.split('/');
    let roomId = pathParts[pathParts.length - 1];
    if (!roomId || roomId === 'r' || roomId === '') {
      const urlParams = new URLSearchParams(window.location.search);
      roomId = urlParams.get('room') || 'default';
    }
    document.getElementById('roomLabel').textContent = `ROOM / ${roomId}`;
    document.getElementById('standbyMeta').textContent = `ROOM · ${roomId}`;

    const stage = document.getElementById('stage');
    const video = document.getElementById('videoPlayer');
    const overlay = document.getElementById('overlay');
    const statusKicker = document.getElementById('statusKicker');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const unmuteBtn = document.getElementById('unmuteBtn');
    const audioToggle = document.getElementById('audioToggle');
    const volumeSlider = document.getElementById('volumeSlider');
    const fitBtn = document.getElementById('fitBtn');
    const fitLabel = document.getElementById('fitLabel');
    const statsBtn = document.getElementById('statsBtn');
    const telemetryPill = document.getElementById('telemetryPill');
    const pipBtn = document.getElementById('pipBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const watchTimer = document.getElementById('watchTimer');
    const meterStrip = document.getElementById('meterStrip');

    const statRes = document.getElementById('statRes');
    const statFps = document.getElementById('statFps');
    const statRate = document.getElementById('statRate');
    const statRtt = document.getElementById('statRtt');

    const whepEndpoint = `${window.location.origin}/${roomId}/whep`;

    // Build 64 real-data meter ticks
    const TICK_COUNT = 64;
    const meterHistory = new Array(TICK_COUNT).fill(0);
    const tickEls = [];
    for (let i = 0; i < TICK_COUNT; i++) {
      const el = document.createElement('div');
      el.className = 'meter-tick';
      meterStrip.appendChild(el);
      tickEls.push(el);
    }

    function renderMeter(mbps) {
      meterHistory.shift();
      meterHistory.push(Math.max(0, mbps));
      const peak = Math.max(4, ...meterHistory);
      for (let i = 0; i < TICK_COUNT; i++) {
        const val = meterHistory[i];
        const px = val > 0 ? Math.max(3, Math.round((val / peak) * 16)) : 2;
        tickEls[i].style.height = `${px}px`;
        tickEls[i].classList.toggle('active', val > 0.05);
      }
    }

    function resetMeter() {
      meterHistory.fill(0);
      for (let i = 0; i < TICK_COUNT; i++) {
        tickEls[i].style.height = '2px';
        tickEls[i].classList.remove('active');
      }
    }

    let pc = null;
    let retryTimeout = null;
    let statsInterval = null;
    let timerInterval = null;
    let connectedAt = 0;
    let prevBytesReceived = 0;
    let prevStatsTime = 0;
    let idleTimeout = null;
    let statsVisible = true;

    statsBtn.classList.add('active');
    if (!document.pictureInPictureEnabled) {
      pipBtn.style.display = 'none';
    }

    function wakeHud() {
      stage.classList.add('hud-visible');
      stage.classList.remove('hud-idle');
      clearTimeout(idleTimeout);
      if (overlay.classList.contains('hidden')) {
        idleTimeout = setTimeout(() => {
          stage.classList.remove('hud-visible');
          stage.classList.add('hud-idle');
        }, 2800);
      }
    }

    stage.addEventListener('mousemove', wakeHud);
    stage.addEventListener('touchstart', wakeHud, { passive: true });
    stage.addEventListener('click', wakeHud);

    function formatElapsed(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function startWatchTimer() {
      connectedAt = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        watchTimer.textContent = formatElapsed(Date.now() - connectedAt);
      }, 1000);
    }

    function stopWatchTimer() {
      clearInterval(timerInterval);
      watchTimer.textContent = '00:00';
    }

    function startStatsPolling() {
      clearInterval(statsInterval);
      prevBytesReceived = 0;
      prevStatsTime = 0;
      statsInterval = setInterval(async () => {
        if (!pc || pc.connectionState !== 'connected') return;
        try {
          const stats = await pc.getStats();
          let rttMs = null;
          stats.forEach((report) => {
            if (report.type === 'inbound-rtp' && report.kind === 'video') {
              if (report.frameWidth && report.frameHeight) {
                statRes.textContent = `${report.frameWidth}X${report.frameHeight}`;
              }
              if (typeof report.framesPerSecond === 'number') {
                statFps.textContent = `${Math.round(report.framesPerSecond)}`;
              }
              const now = report.timestamp;
              if (prevStatsTime > 0 && now > prevStatsTime && report.bytesReceived >= prevBytesReceived) {
                const mbps = ((report.bytesReceived - prevBytesReceived) * 8) / ((now - prevStatsTime) * 1000);
                statRate.textContent = `${mbps.toFixed(1)} MBPS`;
                renderMeter(mbps);
              }
              prevBytesReceived = report.bytesReceived;
              prevStatsTime = now;
            }
            if (report.type === 'candidate-pair' && report.state === 'succeeded' && typeof report.currentRoundTripTime === 'number') {
              rttMs = Math.round(report.currentRoundTripTime * 1000);
            }
          });
          if (rttMs !== null) {
            statRtt.textContent = `${rttMs} MS`;
          }
        } catch (_) {}
      }, 1200);
    }

    function stopStatsPolling() {
      clearInterval(statsInterval);
      statRes.textContent = '--';
      statFps.textContent = '--';
      statRate.textContent = '--';
      statRtt.textContent = '--';
      resetMeter();
    }

    async function startWHEP() {
      if (pc) {
        pc.close();
        pc = null;
      }
      stopStatsPolling();
      stopWatchTimer();
      stage.classList.remove('is-live');

      statusKicker.textContent = 'HANDSHAKE · WHEP';
      statusTitle.innerHTML = 'connecting to <span class="verb-accent">room</span>.';
      statusDesc.textContent = `establishing low-latency handshake for "${roomId}".`;
      overlay.classList.remove('hidden');
      wakeHud();

      pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });

      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });

      pc.ontrack = (event) => {
        if (!video.srcObject) {
          if (event.streams && event.streams[0]) {
            video.srcObject = event.streams[0];
          } else {
            video.srcObject = new MediaStream([event.track]);
          }
        } else {
          if (video.srcObject instanceof MediaStream && !video.srcObject.getTracks().includes(event.track)) {
            video.srcObject.addTrack(event.track);
          }
        }
        video.play().catch(() => {});
      };

      video.onloadedmetadata = () => {
        video.play().catch(() => {});
      };
      video.oncanplay = () => {
        video.play().catch(() => {});
      };

      pc.onconnectionstatechange = () => {
        if (!pc) return;
        if (pc.connectionState === 'connected') {
          stage.classList.add('is-live');
          overlay.classList.add('hidden');
          video.play().catch(() => {});
          startWatchTimer();
          startStatsPolling();
          wakeHud();
        } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
          stage.classList.remove('is-live');
          statusKicker.textContent = 'SIGNAL · INTERRUPTED';
          statusTitle.innerHTML = 'host <span class="verb-accent">disconnected</span>.';
          statusDesc.textContent = 'waiting for host to resume sharing. retrying in 3 seconds.';
          overlay.classList.remove('hidden');
          stopStatsPolling();
          stopWatchTimer();
          scheduleRetry();
        }
      };

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await new Promise((resolve) => {
          if (pc.iceGatheringState === 'complete') {
            resolve();
          } else {
            const checkState = () => {
              if (pc.iceGatheringState === 'complete') {
                pc.removeEventListener('icegatheringstatechange', checkState);
                resolve();
              }
            };
            pc.addEventListener('icegatheringstatechange', checkState);
            setTimeout(resolve, 1500);
          }
        });

        const res = await fetch(whepEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/sdp' },
          body: pc.localDescription.sdp
        });

        if (!res.ok) {
          throw new Error(`WHEP Server responded with status ${res.status}`);
        }

        const answerSdp = await res.text();
        await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
        video.play().catch(() => {});
      } catch (err) {
        stage.classList.remove('is-live');
        statusKicker.textContent = 'STANDBY · WHEP RECEIVER';
        statusTitle.innerHTML = 'waiting for the host to <span class="verb-accent">go</span> live.';
        statusDesc.textContent = 'screen share is not live yet. polling whep endpoint every 3 seconds.';
        overlay.classList.remove('hidden');
        scheduleRetry();
      }
    }

    function scheduleRetry() {
      clearTimeout(retryTimeout);
      retryTimeout = setTimeout(startWHEP, 3000);
    }

    const iconSoundOn = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
    const iconSoundOff = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;

    function syncAudioUi() {
      if (video.muted || video.volume === 0) {
        audioToggle.innerHTML = `${iconSoundOff}<span class="btn-label">unmute</span>`;
      } else {
        unmuteBtn.classList.add('hidden');
        audioToggle.innerHTML = `${iconSoundOn}<span class="btn-label">mute</span>`;
      }
    }

    function unmuteStream() {
      video.muted = false;
      if (video.volume === 0) {
        video.volume = 1;
        volumeSlider.value = '1';
      }
      video.play().then(syncAudioUi).catch(console.error);
    }

    function toggleMute() {
      video.muted = !video.muted;
      if (!video.muted && video.volume === 0) {
        video.volume = 1;
        volumeSlider.value = '1';
      }
      syncAudioUi();
    }

    unmuteBtn.addEventListener('click', unmuteStream);
    audioToggle.addEventListener('click', toggleMute);

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      video.volume = val;
      video.muted = (val === 0);
      syncAudioUi();
    });

    fitBtn.addEventListener('click', () => {
      const isCover = video.classList.toggle('cover');
      fitLabel.textContent = isCover ? 'fill' : 'fit';
      fitBtn.classList.toggle('active', isCover);
    });

    statsBtn.addEventListener('click', () => {
      statsVisible = !statsVisible;
      telemetryPill.classList.toggle('hidden', !statsVisible);
      statsBtn.classList.toggle('active', statsVisible);
    });

    pipBtn.addEventListener('click', async () => {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        console.error(err);
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        stage.requestFullscreen().catch(console.error);
      } else {
        document.exitFullscreen().catch(console.error);
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      const key = e.key.toLowerCase();
      if (key === 'm') toggleMute();
      else if (key === 'f') toggleFullscreen();
      else if (key === 'p' && document.pictureInPictureEnabled) pipBtn.click();
    });

    syncAudioUi();
    startWHEP();
  </script>
</body>
</html>
